name: Midterm forecast

on:
  schedule:
    - cron: "17 12 * * 2" # weekly, Tuesdays 12:17 UTC
  push:
    branches: [main]
    paths: [midterms/**] # re-run when the model or inputs change (its own commits carry [skip ci])
  workflow_dispatch: {} # manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: midterm-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Best-effort: pulls fresh approval + generic-ballot medians from the
      # VoteHub polling API. On any failure the committed inputs are used
      # unchanged, so this never blocks the forecast.
      - name: Refresh polling inputs
        continue-on-error: true
        run: python midterms/fetch_inputs.py

      - name: Run forecast (stdlib only, no deps)
        run: python midterms/model.py

      # Compares live positions + prices against the model; needs the same
      # API secrets as the rewards tracker. Falls back to cached repo data
      # for anything it can't fetch, and never blocks the forecast.
      - name: Check positions vs model
        continue-on-error: true
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          pip install -r requirements.txt
          python midterms/edge_check.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add midterms/FORECAST.md midterms/inputs_2026.json
          git add midterms/EDGE.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly midterm forecast refresh [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
