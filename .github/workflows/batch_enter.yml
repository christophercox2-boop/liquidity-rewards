name: Batch enter new market pairs

# One-shot entry into the freshly-listed, uncontested senate/governor pairs.
# Per race:
#   favourite side -> 1c bid x2000, 99c ask x2000, 51c bid x40
#   underdog  side -> 1c bid x2000, 99c ask x2000, 51c ask x40
# Every order is post-only (participateDontInitiate), so none of them can cross
# the spread and take liquidity - anything that would trade immediately is
# rejected by the exchange rather than filled. Re-running is safe: an order
# already resting at the same (market, side, price) is skipped, not duplicated.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/batch_enter.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: batch-enter
  cancel-in-progress: false

jobs:
  enter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Place the batch
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          pip install -q -r requirements.txt
          python3 - <<'EOF'
          import json, os, time, requests
          import track_rewards as tr

          ARM = "fire"          # "fire" places orders; anything else is a dry run
          DEEP_SIZE, MID_SIZE = 2000, 40
          DEEP_BID, DEEP_ASK, MID_PRICE = 0.01, 0.99, 0.51

          PAIRS = [   # (favourite side, underdog side)
              ("usgubewc-usgub-al-2026-11-03-rep", "usgubewc-usgub-al-2026-11-03-dem"),
              ("ussewc-usse-al-2026-11-03-rep", "ussewc-usse-al-2026-11-03-dem"),
              ("ussewc-usse-ar-2026-11-03-rep", "ussewc-usse-ar-2026-11-03-dem"),
              ("ussewc-usse-co-2026-11-03-dem", "ussewc-usse-co-2026-11-03-rep"),
              ("ussewc-usse-fl-2026-11-03-rep", "ussewc-usse-fl-2026-11-03-dem"),
              ("ussewc-usse-ky-2026-11-03-rep", "ussewc-usse-ky-2026-11-03-dem"),
              ("ussewc-usse-la-2026-11-03-rep", "ussewc-usse-la-2026-11-03-dem"),
              ("ussewc-usse-ms-2026-11-03-rep", "ussewc-usse-ms-2026-11-03-dem"),
              ("ussewc-usse-mt-2026-11-03-rep", "ussewc-usse-mt-2026-11-03-dem"),
              ("ussewc-usse-nj-2026-11-03-dem", "ussewc-usse-nj-2026-11-03-rep"),
              ("ussewc-usse-nm-2026-11-03-dem", "ussewc-usse-nm-2026-11-03-rep"),
              ("ussewc-usse-ok-2026-11-03-rep", "ussewc-usse-ok-2026-11-03-dem"),
              ("ussewc-usse-or-2026-11-03-dem", "ussewc-usse-or-2026-11-03-rep"),
              ("ussewc-usse-ri-2026-11-03-dem", "ussewc-usse-ri-2026-11-03-rep"),
              ("ussewc-usse-sc-2026-11-03-rep", "ussewc-usse-sc-2026-11-03-dem"),
              ("ussewc-usse-va-2026-11-03-dem", "ussewc-usse-va-2026-11-03-rep"),
              ("ussewc-usse-wv-2026-11-03-rep", "ussewc-usse-wv-2026-11-03-dem"),
          ]

          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]

          def api(method, path, **kw):
              return requests.request(
                  method, tr.TRADE_API + path,
                  headers={**tr.auth_headers(kid, sec, method, path),
                           "Content-Type": "application/json"},
                  timeout=30, **kw)

          # what already rests, so a re-run never doubles up
          r = api("GET", "/v1/orders/open"); r.raise_for_status()
          existing = set()
          for o in r.json().get("orders") or []:
              slug = o.get("marketSlug") or (o.get("marketMetadata") or {}).get("slug") or ""
              side = "BUY" if str(o.get("side", "")).upper().endswith("BUY") else "SELL"
              existing.add((slug, side, round(tr._num(o.get("price")), 4)))
          print(f"{len(existing)} (market, side, price) keys already resting")

          # net positions, so SELL opens a short only when we hold nothing to sell
          nets = {}
          try:
              pth = "/v1/portfolio/positions"
              rr = requests.get(tr.TRADE_API + pth,
                                headers=tr.auth_headers(kid, sec, "GET", pth),
                                params={"limit": 200}, timeout=30)
              if rr.status_code < 400:
                  for k, v in (rr.json().get("positions") or {}).items():
                      nets[k] = float(v.get("netPosition") or 0)
          except Exception as e:
              print("positions lookup failed, assuming flat:", e)

          def intent_for(side, net):
              if side == "BUY":
                  return "ORDER_INTENT_SELL_SHORT" if net < 0 else "ORDER_INTENT_BUY_LONG"
              return "ORDER_INTENT_SELL_LONG" if net > 0 else "ORDER_INTENT_BUY_SHORT"

          orders = []
          for fav, dog in PAIRS:
              for slug in (fav, dog):
                  orders.append((slug, "BUY", DEEP_BID, DEEP_SIZE, "1c parking bid"))
                  orders.append((slug, "SELL", DEEP_ASK, DEEP_SIZE, "99c parking ask"))
              orders.append((fav, "BUY", MID_PRICE, MID_SIZE, "51c bid on the favourite"))
              orders.append((dog, "SELL", MID_PRICE, MID_SIZE, "51c ask on the underdog"))

          print(f"planned: {len(orders)} orders across {len(PAIRS)} races")
          if ARM != "fire":
              for o in orders:
                  print("   DRY", o)
              raise SystemExit(0)

          placed, skipped, rejected = [], [], []
          for slug, side, px, sz, why in orders:
              key = (slug, side, round(px, 4))
              if key in existing:
                  skipped.append([slug, side, px, "already resting"]); continue
              body = {"marketSlug": slug, "intent": intent_for(side, nets.get(slug, 0.0)),
                      "type": "ORDER_TYPE_LIMIT",
                      # price.value MUST be a string: a float is rejected with a
                      # generic 400 (code 3), which is what killed the first run.
                      "price": {"value": f"{px:.2f}", "currency": "USD"},
                      "quantity": sz,
                      "tif": "TIME_IN_FORCE_GOOD_TILL_CANCEL",
                      "participateDontInitiate": True}
              rr = api("POST", "/v1/orders", json=body)
              if rr.status_code < 300:
                  placed.append([slug, side, px, sz]); existing.add(key)
                  print(f"  OK   {slug:40s} {side:4s} {px:5.2f} x{sz}")
              else:
                  msg = " ".join(rr.text.split())[:180]
                  rejected.append([slug, side, px, sz, rr.status_code, msg])
                  print(f"  FAIL {slug:40s} {side:4s} {px:5.2f} x{sz} -> {rr.status_code} {msg}")
              time.sleep(0.35)

          print(f"\nplaced {len(placed)} | skipped {len(skipped)} | rejected {len(rejected)}")
          os.makedirs("data", exist_ok=True)
          with open("data/batch_enter_result.json", "w") as f:
              json.dump({"placed": placed, "skipped": skipped, "rejected": rejected}, f, indent=1)
          EOF

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/batch_enter_result.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Batch entry result [skip ci]"
            git pull --rebase origin main
            git push
          fi
