name: Silver race screen

# Prices every resting Senate order against Silver Bulletin's per-race
# forecast and reports which ones would lose money if they filled.
#
# This is the screen the chamber-level series could not support. Chart kNspD
# ("Who is favored to win each Senate race?") gives a win probability per
# state, which maps one-to-one onto the ussewc-usse-{st}-{date}-{dem,rep}
# books. For a resting order the question that matters is not whether the
# model beats the market in the long run, it is what a FILL costs: a bid at
# 85c on something the model prices at 20c hands over 65c a share the moment
# somebody takes it, which dwarfs any rewards that order was earning.
#
# Read-only. It places nothing, cancels nothing, reprices nothing. Deciding
# what to do about a flagged order is the owner's call, not this workflow's.

on:
  schedule:
    - cron: "45 12 * * *"      # 08:45 ET, after the daily fetch
  push:
    branches: [main]
    paths:
      - .github/workflows/silver_races.yml
      - silver_model.py
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: silver-races
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Screen resting orders
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          pip install -q -r requirements.txt
          python3 - <<'EOF'
          import collections, io, os, time, requests
          import track_rewards as tr
          import silver_model as sm

          # a fill this far the wrong side of the model is worth looking at
          FLAG = 0.10

          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          BUF = io.StringIO(); _p = print
          def print(*a, **k):
              _p(*a, **k); _p(*a, **{**k, "file": BUF})
          def api(method, path, **kw):
              return requests.request(method, tr.TRADE_API + path,
                  headers={**tr.auth_headers(kid, sec, method, path),
                           "Content-Type": "application/json"}, timeout=30, **kw)

          races = sm.load_races()
          print(f"Silver Bulletin per-race Senate forecast: {len(races)} races\n")

          r = api("GET", "/v1/orders/open"); r.raise_for_status()
          orders = []
          for o in r.json().get("orders") or []:
              if str(o.get("state")) in tr.DEAD_ORDER_STATES:
                  continue
              slug = o.get("marketSlug") or ""
              orders.append({
                  "slug": slug,
                  "side": "BUY" if str(o.get("side", "")).upper().endswith("BUY") else "SELL",
                  "px": tr._num(o.get("price")),
                  "sz": tr._num(o.get("leavesQuantity")) or tr._num(o.get("quantity")),
              })
          print(f"{len(orders)} live orders")

          senate = [o for o in orders if o["slug"].startswith("ussewc-usse-")]
          modelled = []
          for o in senate:
              fair = sm.race_fair(o["slug"], races)
              if fair is None:
                  continue
              o["fair"] = fair
              o["edge"] = sm.mark_to_model(o["side"], o["px"], fair)
              o["risk"] = o["edge"] * o["sz"]
              modelled.append(o)
          print(f"{len(senate)} are Senate races, {len(modelled)} of those the model covers")
          uncovered = {o['slug'] for o in orders} - {o['slug'] for o in modelled}
          print(f"{len(uncovered)} markets left unmodelled "
                f"(governor, House, seat counts, everything non-Senate)\n")

          bad = sorted((o for o in modelled if o["edge"] < -FLAG), key=lambda o: o["risk"])
          if not bad:
              print(f"No resting Senate order is more than {FLAG:.0%} the wrong side "
                    f"of the model.")
          else:
              gross = sum(o["risk"] for o in bad)
              print(f"{len(bad)} resting orders would lose more than {FLAG:.0%} a share "
                    f"if filled, {gross:,.0f} dollars in total if every one of them "
                    f"filled at once:\n")
              print(f"  {'market':<42s} {'side':<5s} {'price':>6s} {'model':>7s} "
                    f"{'per sh':>7s} {'size':>8s} {'if filled':>10s}")
              for o in bad[:40]:
                  print(f"  {o['slug'][:42]:<42s} {o['side']:<5s} {o['px']:>6.2f} "
                        f"{o['fair']:>7.3f} {o['edge']:>7.3f} {o['sz']:>8,.0f} "
                        f"{o['risk']:>10,.0f}")
              if len(bad) > 40:
                  print(f"  ... and {len(bad)-40} more not shown")

          # the flip side: where the model says our resting size is comfortable
          good = [o for o in modelled if o["edge"] >= 0]
          print(f"\n{len(good)} of {len(modelled)} modelled orders are at or better than "
                f"model fair value -- a fill there is not a loss on the model's numbers.")

          # per-race summary so the shape is visible, not just the outliers
          print("\nper-race view (model probability vs where our orders rest):")
          by_race = collections.defaultdict(list)
          for o in modelled:
              by_race[o["slug"].split("-")[2].lower()].append(o)
          print(f"  {'race':<6s} {'model D':>8s} {'model R':>8s} {'orders':>7s} "
                f"{'worst/sh':>9s}")
          for st in sorted(by_race):
              g = by_race[st]
              race = races[st]
              worst = min(o["edge"] for o in g)
              print(f"  {st.upper():<6s} {race['dem']:>8.3f} {race['rep']:>8.3f} "
                    f"{len(g):>7d} {worst:>9.3f}")

          print("\nNothing was placed, cancelled or repriced. This is a read-only screen.")

          os.makedirs("data", exist_ok=True)
          with open("data/silver_races.txt", "w") as f:
              f.write(BUF.getvalue())
          EOF

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/silver_races.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Silver race screen [skip ci]"
            git pull --rebase origin main
            git push
          fi
