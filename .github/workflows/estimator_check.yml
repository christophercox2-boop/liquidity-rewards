name: Estimator scoreboard

# Scores the two earnings estimators against real payouts, so the choice
# between them is settled by data instead of argument.
#
#   sparse  — tracker_day_integral over data/estimates.csv. Piecewise-constant
#             integration of whatever snapshots the hourly tracker happened to
#             take: 31 of them on 2026-08-09.
#   hf      — the monitor's own integral at POLL_SECONDS (2,880/day at 30s),
#             carried in state.json history as `earned_hf`.
#
# Why sampling density is the whole game: the exchange scores a RANDOM
# SNAPSHOT OF THE BOOK EVERY SECOND and weights all 86,400 equally
# (docs.polymarket.us/incentives/liquidity). It also pays nothing to an order
# outside the Target Size window, so in a deep book, scoring flickers between
# full and zero second by second. Sampling that 31 times — right after we
# place or defend, when our share peaks — reads the top of the flicker as if
# it were the whole day. Measured against actual payouts the sparse estimator
# ran 1.58x-2.03x high in aggregate, with per-market error up to 94x.
#
# `hf` only has data from the deploy that introduced it forward; days before
# that show "-". Read the scoreboard once a few days have accumulated.

on:
  schedule:
    - cron: "30 14 * * *"      # 10:30 ET, after the overnight payouts settle
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: estimator-check
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Score both estimators against actual payouts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          pip install -q -r requirements.txt
          python3 - <<'EOF'
          import base64, collections, csv, datetime as dt, gzip, io, json, os, statistics
          import requests

          REPO = "wfco223/Liquidity-rewards"
          BRANCH = "live-state"
          tok = os.environ.get("STATE_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""

          BUF = io.StringIO()
          _p = print
          def print(*a, **k):
              _p(*a, **k); _p(*a, **{**k, "file": BUF})

          # ---- actual payouts -------------------------------------------------
          actual = collections.defaultdict(float)
          for r in csv.DictReader(open("data/rewards.csv")):
              actual[r["date"]] += float(r["reward_usd"])

          # ---- sparse estimator: integrate estimates.csv per ET day ----------
          runs = collections.defaultdict(lambda: collections.defaultdict(float))
          for r in csv.DictReader(open("data/estimates.csv")):
              runs[r["checked_at_utc"]][r["market"]] += float(r["est_day"])
          ET = dt.timezone(dt.timedelta(hours=-4))
          byday = collections.defaultdict(list)
          for ts in runs:
              d = dt.datetime.strptime(ts, "%Y-%m-%d %H:%M:%S").replace(
                  tzinfo=dt.timezone.utc).astimezone(ET)
              byday[d.strftime("%Y-%m-%d")].append(ts)
          sparse, nsnap = {}, {}
          for day, times in byday.items():
              times.sort()
              midnight = dt.datetime.strptime(day, "%Y-%m-%d").replace(tzinfo=ET)
              end_of_day = midnight + dt.timedelta(days=1)
              now = min(dt.datetime.now(dt.timezone.utc), end_of_day.astimezone(dt.timezone.utc))
              tot = 0.0
              for i, ts in enumerate(times):
                  t = dt.datetime.strptime(ts, "%Y-%m-%d %H:%M:%S").replace(tzinfo=dt.timezone.utc)
                  start = midnight.astimezone(dt.timezone.utc) if i == 0 else t
                  nxt = (dt.datetime.strptime(times[i + 1], "%Y-%m-%d %H:%M:%S")
                         .replace(tzinfo=dt.timezone.utc) if i + 1 < len(times) else now)
                  frac = max((nxt - start).total_seconds(), 0.0) / 86400.0
                  tot += sum(runs[ts].values()) * frac
              sparse[day] = tot; nsnap[day] = len(times)

          # ---- high-frequency estimator: state.json history -------------------
          hf, hfn, sparse_recorded = {}, {}, {}
          try:
              r = requests.get(f"https://api.github.com/repos/{REPO}/contents/state.json",
                               params={"ref": BRANCH},
                               headers={"Authorization": f"Bearer {tok}",
                                        "Accept": "application/vnd.github.raw+json"},
                               timeout=30)
              raw = r.content if r.status_code == 200 else b""
              if raw[:2] == b"\x1f\x8b":
                  raw = gzip.decompress(raw)
              st = json.loads(raw or b"{}")
              for h in st.get("history") or []:
                  if h.get("earned_hf") is not None:
                      hf[h["day"]] = float(h["earned_hf"]); hfn[h["day"]] = h.get("hf_samples") or 0
                  # `earned` is now the headline (hf once a day has enough
                  # samples), so the sparse figure has its own key. Recomputed
                  # from estimates.csv below either way; this is the crosscheck.
                  if h.get("earned_sparse") is not None:
                      sparse_recorded[h["day"]] = float(h["earned_sparse"])
              print(f"state.json: {len(st.get('history') or [])} history rows, "
                    f"{len(hf)} carrying earned_hf")
          except Exception as e:
              print(f"could not read state.json ({type(e).__name__}: {e}) — sparse only")

          # ---- scoreboard -----------------------------------------------------
          print(f"\n{'day':12s} {'snaps':>6s} {'sparse':>9s} {'ratio':>7s} "
                f"{'hf':>9s} {'ratio':>7s} {'ACTUAL':>9s}")
          se, he = [], []
          for day in sorted(set(actual) & set(sparse)):
              a = actual[day]
              if a <= 0:
                  continue
              sr = sparse[day] / a
              se.append(sr)
              hs = f"{hf[day]:9.2f}" if day in hf else f"{'-':>9s}"
              hr = f"{hf[day]/a:6.2f}x" if day in hf else f"{'-':>7s}"
              if day in hf:
                  he.append(hf[day] / a)
              print(f"{day:12s} {nsnap[day]:6d} {sparse[day]:9.2f} {sr:6.2f}x "
                    f"{hs} {hr} {a:9.2f}")

          def summarize(label, xs):
              if not xs:
                  print(f"\n{label}: no days yet"); return
              err = [abs(x - 1) for x in xs]
              print(f"\n{label}: {len(xs)} days | median {statistics.median(xs):.2f}x | "
                    f"mean abs error {100*statistics.mean(err):.0f}% | "
                    f"within +/-25%: {sum(1 for e in err if e <= .25)}/{len(xs)}")
          summarize("sparse", se)
          summarize("hf    ", he)
          if he:
              print("\nVERDICT: hf wins" if statistics.mean([abs(x-1) for x in he])
                    < statistics.mean([abs(x-1) for x in se]) else
                    "\nVERDICT: sparse still wins — do not switch")
          else:
              print("\nhf has no completed days yet. It starts accruing from the deploy "
                    "that added it; check back after a full ET day has rolled over.")

          os.makedirs("data", exist_ok=True)
          with open("data/estimator_check.txt", "w") as f:
              f.write(BUF.getvalue())
          EOF

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estimator_check.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Estimator scoreboard [skip ci]"
            # Several workflows push to this repo at once. A lost race used to
            # fail the step and throw the run's output away — retry instead.
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then pushed=yes; break; fi
              echo "push race lost (attempt $attempt) — retrying"
              sleep $((attempt * 3))
            done
            if [ -z "$pushed" ]; then echo "push failed after 5 attempts"; exit 1; fi
          fi
