name: High-frequency sampling probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf_probe.yml
  schedule:
    - cron: "5 15 * * *"  # 11:05 ET — record while the bots are awake
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hf-probe
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record one contested market at 10s resolution for 25 min
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          pip install -q -r requirements.txt
          python3 - <<'EOF'
          import csv, json, os, time, requests
          import track_rewards as tr

          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]

          # Targets: the most CONTESTED ladder rungs — where our share sits in
          # the 5-95% fight zone (owned-outright rungs are flat and prove
          # nothing). Up to 3 rungs, ranked by est_day; falls back to the top
          # earners if nothing is contested.
          contested, fallback = {}, {}
          try:
              with open("data/live_orders.csv") as f:
                  for row in csv.DictReader(f):
                      m = row["market"]
                      if not m.startswith(("scc-senate-gop", "scc-hrep-rep")):
                          continue
                      e = float(row["est_day"] or 0)
                      fallback[m] = fallback.get(m, 0) + e
                      sh = float(row["share"] or 0) if row.get("share") else None
                      if sh is not None and 0.05 < sh < 0.95:
                          contested[m] = contested.get(m, 0) + e
          except Exception as e:
              print("target pick failed:", e)
          pool = contested or fallback or {"scc-senate-gop-2026-11-03-52": 0}
          slugs = [m for m, _ in sorted(pool.items(), key=lambda kv: -kv[1])[:3]]
          print("recording:", slugs)

          def my_orders():
              path = "/v1/orders/open"
              r = requests.get(tr.TRADE_API + path,
                               headers=tr.auth_headers(kid, sec, "GET", path), timeout=20)
              r.raise_for_status()
              out = {s: [] for s in slugs}
              for o in r.json().get("orders") or []:
                  s = o.get("marketSlug") or ""
                  if s not in out:
                      continue
                  out[s].append({"id": o.get("id"),
                                 "side": "BUY" if str(o.get("side", "")).upper().endswith("BUY") else "SELL",
                                 "price": tr._num(o.get("price")),
                                 "size": tr._num(o.get("leavesQuantity")) or tr._num(o.get("quantity")),
                                 "intent": o.get("intent")})
              return out

          t_end = time.time() + 2400  # 40 minutes
          last_orders = -1e9
          n_books = n_orders = 0
          i = 0
          with open("data/probe_hf.jsonl", "w") as f:
              f.write(json.dumps({"kind": "meta", "markets": slugs,
                                  "started": time.time()}) + "\n")
              while time.time() < t_end:
                  t0 = time.time()
                  if t0 - last_orders >= 60:
                      last_orders = t0
                      try:
                          f.write(json.dumps({"kind": "orders", "t": round(t0, 1),
                                              "orders": my_orders()}) + "\n")
                          n_orders += 1
                      except Exception as e:
                          f.write(json.dumps({"kind": "orders_err", "t": round(t0, 1),
                                              "err": str(e)[:120]}) + "\n")
                  slug = slugs[i % len(slugs)]  # ~20s per market at 3 markets
                  i += 1
                  try:
                      b = tr._fetch_book(slug)
                      f.write(json.dumps({"kind": "book", "t": round(t0, 1),
                                          "market": slug, "tick": b["tick"],
                                          "bids": b["bids"][:12],
                                          "asks": b["asks"][:12]}) + "\n")
                      n_books += 1
                  except Exception as e:
                      f.write(json.dumps({"kind": "book_err", "t": round(t0, 1),
                                          "market": slug, "err": str(e)[:120]}) + "\n")
                  f.flush()
                  time.sleep(max(0.0, 7.0 - (time.time() - t0)))
          print(f"recorded {n_books} book samples, {n_orders} order snapshots")
          EOF

      - name: Commit recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_hf.jsonl
          git commit -m "High-frequency sampling probe [skip ci]"
          # Several workflows push to this repo at once. A lost race used to
          # fail the step and throw the run's output away — retry instead.
          pushed=""
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then pushed=yes; break; fi
            echo "push race lost (attempt $attempt) — retrying"
            sleep $((attempt * 3))
          done
          if [ -z "$pushed" ]; then echo "push failed after 5 attempts"; exit 1; fi