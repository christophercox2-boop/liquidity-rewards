name: Market scan

on:
  push:
    branches: [main]
    paths:
      - scan_markets.py
      - .github/workflows/scan.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan all politics markets
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: python scan_markets.py

      - name: Commit plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md data/scan.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Market scan [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
