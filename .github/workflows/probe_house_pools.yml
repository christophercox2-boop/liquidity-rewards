name: Probe house pools

# READ-ONLY. Places nothing.
#
# Re-check of "do any House district markets carry a reward pool?".
#
# The earlier answer came from the full incentives crawl, which is
# alphabetical and rate limited out (HTTP 429) after 30 pages while still deep
# in the sports families — it never reached the u-prefixed slugs at all. So
# "no ushrewc pools" was an artifact of where the crawl stopped, not a finding.
#
# This asks directly with the symbol filter, which answers precisely for the
# slugs handed to it. Note symbols must be a LIST: requests emits repeated
# params, and comma-joining silently matches nothing.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe_house_pools.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: probe-house-pools
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          pip install -q -r requirements.txt
          python3 - <<'EOF'
          import collections, io, json, os, time, requests
          import track_rewards as tr

          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          BUF = io.StringIO(); _p = print
          def print(*a, **k):
              _p(*a, **k); _p(*a, **{**k, "file": BUF})

          # real 2020-apportionment seat counts, so every district that exists
          # is probed and none that do not
          SEATS = {"al": 7, "ak": 1, "az": 9, "ar": 4, "ca": 52, "co": 8, "ct": 5, "de": 1,
                   "fl": 28, "ga": 14, "hi": 2, "id": 2, "il": 17, "in": 9, "ia": 4, "ks": 4,
                   "ky": 6, "la": 6, "me": 2, "md": 8, "ma": 9, "mi": 13, "mn": 8, "ms": 4,
                   "mo": 8, "mt": 2, "ne": 3, "nv": 4, "nh": 2, "nj": 12, "nm": 3, "ny": 26,
                   "nc": 14, "nd": 1, "oh": 15, "ok": 5, "or": 6, "pa": 17, "ri": 2, "sc": 7,
                   "sd": 1, "tn": 9, "tx": 38, "ut": 4, "vt": 1, "va": 11, "wa": 10, "wv": 2,
                   "wi": 8, "wy": 1}
          cand = []
          for st, n in sorted(SEATS.items()):
              for d in range(1, n + 1):
                  for side in ("dem", "rep"):
                      cand.append((f"{st}-{d:02d}", side,
                                   f"ushrewc-ushr-{st}-{d:02d}-2026-11-03-{side}"))
          print(f"checking {len(cand)} House district slugs across {len(SEATS)} states")

          held = set()
          r = requests.get(tr.TRADE_API + "/v1/orders/open",
                           headers=tr.auth_headers(kid, sec, "GET", "/v1/orders/open"), timeout=30)
          if r.status_code < 400:
              for o in r.json().get("orders") or []:
                  if str(o.get("state")) == "ORDER_STATE_NEW":
                      held.add(o.get("marketSlug") or "")
          else:
              print(f"WARNING: open orders HTTP {r.status_code}")

          progs = {}
          slugs = [c[2] for c in cand]
          errs = 0
          for i in range(0, len(slugs), 40):
              batch = slugs[i:i + 40]   # LIST, not comma-joined
              try:
                  rr = requests.get(tr.HOSTS[0] + "/v1/incentives",
                                    params={"symbols": batch, "pageSize": 100}, timeout=30)
                  if rr.status_code >= 400:
                      errs += 1
                      if errs <= 3:
                          print(f"  batch {i//40}: HTTP {rr.status_code}")
                      time.sleep(3)
                      continue
                  for p in rr.json().get("programs") or []:
                      s = p.get("marketSlug") or ""
                      for tp in p.get("timePeriods") or []:
                          if str(tp.get("status") or "").lower() in ("active", "live", "status_live"):
                              progs[s] = tp
              except Exception as e:
                  errs += 1
                  if errs <= 3:
                      print(f"  batch {i//40}: {type(e).__name__}")
              time.sleep(0.4)

          print(f"\nbatches with errors: {errs} of {len(range(0, len(slugs), 40))}")
          print(f"House markets carrying an ACTIVE pool: {len(progs)}")
          if not progs:
              print("\nCONFIRMED: no House district market has a reward program.")
              print("The districts we hold earn nothing, and entering more earns nothing.")
          else:
              held_n = sum(1 for s in progs if s in held)
              print(f"  held {held_n} | NOT entered {len(progs) - held_n}\n")
              pools = collections.Counter(t["rewardPool"] for t in progs.values())
              print(f"  pool sizes: {dict(pools)}")
              for s in sorted(progs):
                  t = progs[s]
                  print(f"   {'HELD ' if s in held else '     '} {s:46s} pool {t['rewardPool']:>5} "
                        f"target {t['targetSize']:>6} df {t['discountFactor']}")

          os.makedirs("data", exist_ok=True)
          json.dump({"programs": progs, "checked": len(cand), "errors": errs},
                    open("data/house_pools.json", "w"), indent=1)
          with open("data/house_pools.txt", "w") as f:
              f.write(BUF.getvalue())
          EOF

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/house_pools.json data/house_pools.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Probe house pools [skip ci]"
            git pull --rebase origin main
            git push
          fi
