name: API probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: api-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raw incentives payload (zero-paying vs paying strikes)
        continue-on-error: true
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          mkdir -p data
          pip install -q -r requirements.txt
          python3 - <<'EOF'
          import json, os, requests
          import track_rewards as tr
          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          syms = ["scc-senate-gop-2026-11-03-48", "scc-senate-gop-2026-11-03-51",
                  "scc-senate-gop-2026-11-03-52", "scc-hrep-rep-2026-11-03-gte205",
                  "scc-senate-gop-2026-11-03-49", "scc-senate-gop-2026-11-03-50",
                  "scc-senate-gop-2026-11-03-53", "scc-hrep-rep-2026-11-03-gte200",
                  "opdc-mcconnell-resign-2026-11-02", "apdc-jerpowgov-2026-12-31"]
          path = "/v1/incentives"
          r = requests.get(tr.TRADE_API + path,
                           headers=tr.auth_headers(kid, sec, "GET", path),
                           params={"symbols": syms, "pageSize": 50}, timeout=30)
          r.raise_for_status()
          with open("data/probe_incentives.json", "w") as f:
              json.dump(r.json(), f, indent=1)
          for m in r.json().get("programs") or []:
              tps = m.get("timePeriods") or []
              live = [tp for tp in tps if str(tp.get("status")) != "closed"]
              print(m.get("marketSlug"), "| periods:", len(tps), "active:",
                    [(tp.get("programId"), tp.get("period"), tp.get("rewardPool"),
                      tp.get("status"), str(tp.get("end"))) for tp in live][:3])
          EOF

      - name: Recent activity payload (trade states)
        continue-on-error: true
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          pip install -q -r requirements.txt
          python3 - <<'EOF'
          import json, os, requests
          import track_rewards as tr
          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          path = "/v1/portfolio/activities"
          r = requests.get(tr.TRADE_API + path,
                           headers=tr.auth_headers(kid, sec, "GET", path),
                           params={"limit": 60, "sortOrder": "SORT_ORDER_DESCENDING",
                                   "types": ["ACTIVITY_TYPE_TRADE"]}, timeout=30)
          r.raise_for_status()
          with open("data/probe_activities.json", "w") as f:
              json.dump(r.json(), f, indent=1)
          EOF

      - name: Earnings endpoint variations
        continue-on-error: true
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, requests, collections
          import track_rewards as tr
          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          host = tr.HOSTS[0]
          out = {}
          def page(tag, params):
              r = requests.get(host + tr.EARNINGS_PATH, params=params,
                               headers=tr.auth_headers(kid, sec, "GET", tr.EARNINGS_PATH),
                               timeout=30)
              j = r.json() if r.status_code < 400 else {"error": r.status_code, "body": r.text[:300]}
              out[tag] = {"params": params, "status": r.status_code,
                          "keys": sorted(j.keys()) if isinstance(j, dict) else None,
                          "n": len(j.get("rewards") or []) if isinstance(j, dict) else 0,
                          "sample": (j.get("rewards") or [None])[0] if isinstance(j, dict) else None}
              cats = collections.Counter()
              dates = collections.Counter()
              for row in (j.get("rewards") or []):
                  cats[(row.get("marketSlug") or "").split("-")[0]] += 1
                  dates[str(row.get("date", ""))[:10]] += 1
              out[tag]["cats"] = dict(cats)
              out[tag]["dates"] = dict(sorted(dates.items())[-6:])
              return j
          page("current", {"startDate": "2026-07-28"})
          page("noparams", {})
          page("bigpage", {"startDate": "2026-07-28", "pageSize": 500})
          with open("data/probe_earnings.json", "w") as f:
              json.dump(out, f, indent=1, default=str)
          for k, v in out.items():
              print(k, v["status"], "rows:", v["n"], "cats:", v["cats"], "dates:", v["dates"])
          EOF

      - name: Open orders payload
        continue-on-error: true
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, requests
          import track_rewards as tr
          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          path = "/v1/orders/open"
          r = requests.get(tr.TRADE_API + path,
                           headers=tr.auth_headers(kid, sec, "GET", path), timeout=30)
          r.raise_for_status()
          with open("data/probe_orders.json", "w") as f:
              json.dump(r.json(), f, indent=1)
          print("open orders:", len(r.json().get("orders") or []))
          EOF

      - name: Positions payload (short-position shape)
        continue-on-error: true
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, requests
          import track_rewards as tr
          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          path = "/v1/portfolio/positions"
          out, cursor = {}, None
          for _ in range(5):
              params = {"limit": 100}
              if cursor:
                  params["cursor"] = cursor
              r = requests.get(tr.TRADE_API + path,
                               headers=tr.auth_headers(kid, sec, "GET", path),
                               params=params, timeout=30)
              r.raise_for_status()
              j = r.json()
              out.update(j.get("positions") or {})
              cursor = j.get("nextCursor")
              if j.get("eof") or not cursor:
                  break
          with open("data/probe_positions.json", "w") as f:
              json.dump(out, f, indent=1)
          neg = {k: v for k, v in out.items() if float(v.get("netPosition") or 0) < 0}
          print("positions:", len(out), "| net-negative:", len(neg), list(neg)[:5])
          EOF

      - name: Book presence — is every open order visible on the public book?
        continue-on-error: true
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, time, requests
          import track_rewards as tr
          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          path = "/v1/orders/open"
          r = requests.get(tr.TRADE_API + path,
                           headers=tr.auth_headers(kid, sec, "GET", path), timeout=30)
          r.raise_for_status()
          orders = []
          for o in r.json().get("orders") or []:
              slug = o.get("marketSlug") or (o.get("marketMetadata") or {}).get("slug") or ""
              size = tr._num(o.get("leavesQuantity")) or tr._num(o.get("quantity"))
              side = "BUY" if str(o.get("side", "")).upper().endswith("BUY") else "SELL"
              orders.append({"market": slug, "side": side, "intent": str(o.get("intent") or ""),
                             "price": tr._num(o.get("price")), "size": size})
          by = {}
          for o in orders:
              by.setdefault(o["market"], []).append(o)
          out = {"checked": 0, "present": 0, "short": [], "missing": []}
          for slug, os_ in sorted(by.items()):
              try:
                  book = tr._fetch_book(slug)
              except Exception as e:
                  out["missing"].append({"market": slug, "err": f"{type(e).__name__}: {e}"})
                  continue
              time.sleep(0.3)
              # several orders can rest at one level — compare our TOTAL size
              # there against the level's public depth
              want = {}
              for o in os_:
                  want.setdefault((o["side"], round(o["price"], 4)), []).append(o)
              for (side, px), grp in want.items():
                  mine = sum(o["size"] for o in grp)
                  lv = book.get("bids") if side == "BUY" else book.get("asks")
                  depth = sum(q for p, q in (lv or []) if abs(p - px) < 1e-9)
                  out["checked"] += 1
                  if depth >= mine - 0.5:
                      out["present"] += 1
                  else:
                      row = {"market": slug, "side": side, "price": px, "my_size": mine,
                             "book_at_price": depth,
                             "intents": sorted({o["intent"] for o in grp})}
                      (out["short"] if depth > 0 else out["missing"]).append(row)
          with open("data/probe_book_presence.json", "w") as f:
              json.dump(out, f, indent=1)
          print("levels checked:", out["checked"], "| fully present:", out["present"],
                "| short:", len(out["short"]), "| missing:", len(out["missing"]))
          for row in (out["short"] + out["missing"])[:10]:
              print("  ", row)
          EOF

      - name: Official liquidity-program docs (full rules text)
        continue-on-error: true
        run: |
          curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36" \
            "https://docs.polymarket.us/incentives/liquidity" -o /tmp/liq.html || true
          python3 - <<'EOF'
          import html, re
          try:
              raw = open("/tmp/liq.html", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              raw = ""
          text = re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", raw, flags=re.S | re.I)
          text = re.sub(r"<[^>]+>", "\n", text)
          text = html.unescape(text)
          text = re.sub(r"\n{3,}", "\n\n", re.sub(r"[ \t]+", " ", text)).strip()
          with open("data/probe_liquidity_docs.txt", "w") as f:
              f.write(text[:60000] or "FETCH FAILED")
          print(len(text), "chars;", text[:400].replace("\n", " | "))
          EOF

      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_incentives.json data/probe_activities.json data/probe_positions.json data/probe_orders.json data/probe_earnings.json data/probe_book_presence.json data/probe_liquidity_docs.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "API probe [skip ci]"
            git pull --rebase origin main
            git push
          fi

