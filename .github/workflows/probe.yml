name: API probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: api-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Raw incentives payload (politics + golf samples)
        run: |
          mkdir -p data
          curl -sS "https://api.prod.polymarketexchange.com/v1/incentives?symbols=apdc-kashpatel-2026-08-31&symbols=cranc-uspres28-12-31-2026-elomus&symbols=opdc-mcconnell-resign-2026-11-02&symbols=tec-pga-rockclas-2026-08-02-r3l-joedah&pageSize=20" \
            | python3 -m json.tool > data/probe_incentives.json
          head -c 2000 data/probe_incentives.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recent activity payload (trade states)
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          pip install -q -r requirements.txt
          python3 - <<'EOF'
          import json, os, requests
          import track_rewards as tr
          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          path = "/v1/portfolio/activities"
          r = requests.get(tr.TRADE_API + path,
                           headers=tr.auth_headers(kid, sec, "GET", path),
                           params={"limit": 60, "sortOrder": "SORT_ORDER_DESCENDING",
                                   "types": ["ACTIVITY_TYPE_TRADE"]}, timeout=30)
          r.raise_for_status()
          with open("data/probe_activities.json", "w") as f:
              json.dump(r.json(), f, indent=1)
          EOF

      - name: Positions payload (short-position shape)
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, requests
          import track_rewards as tr
          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          path = "/v1/portfolio/positions"
          out, cursor = {}, None
          for _ in range(5):
              params = {"limit": 100}
              if cursor:
                  params["cursor"] = cursor
              r = requests.get(tr.TRADE_API + path,
                               headers=tr.auth_headers(kid, sec, "GET", path),
                               params=params, timeout=30)
              r.raise_for_status()
              j = r.json()
              out.update(j.get("positions") or {})
              cursor = j.get("nextCursor")
              if j.get("eof") or not cursor:
                  break
          with open("data/probe_positions.json", "w") as f:
              json.dump(out, f, indent=1)
          neg = {k: v for k, v in out.items() if float(v.get("netPosition") or 0) < 0}
          print("positions:", len(out), "| net-negative:", len(neg), list(neg)[:5])
          EOF

      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_incentives.json data/probe_activities.json data/probe_positions.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "API probe [skip ci]"
            git pull --rebase origin main
            git push
          fi
