name: Restore near-touch orders

# Re-places the 105 near-touch orders (everything that is not a 1c/99c
# qualifier) destroyed by the broken modify endpoint, from the last clean
# pre-shredding snapshot (15:18 UTC, live states only — no ghosts).
#
# PLACEMENTS ONLY, post-only: an order whose book has moved through its old
# price is rejected by the exchange instead of trading, which is the correct
# outcome — those need a fresh decision, not a blind re-entry. Skips anything
# already resting at the same (market, side, price).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore_neartouch.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: restore-neartouch
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
