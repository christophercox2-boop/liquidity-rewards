name: Pre-maintenance snapshot

# Log every resting order in enough detail to re-place it exactly — market,
# side, price as the API's own STRING (a float is rejected), quantity, intent
# and order id.
#
# Written for a maintenance window, but it earns its keep against any event
# that empties the book. On 2026-08-10, 223 orders were cancelled on an
# ordinary evening with no window involved; the manifest taken 45 minutes
# earlier was what put them all back.
#
# Defend caps are deliberately NOT touched. They already sit at or above the
# levels these orders rest at, which is the headroom you want: if the books
# reopen cheap you re-enter cheap, and defend is still willing to climb back to
# where you were if rivals return to their old prices.

on:
  schedule:
    # Hourly through the night rather than a couple of shots aimed at a
    # specific window. Two reasons:
    #
    #   1. A scheduled run is queued, not guaranteed. Under load Actions
    #      routinely starts 10-30 minutes late, so a single fire timed just
    #      ahead of a window can land after it has already opened.
    #   2. A stated window time is not always the time it happens, and "06:00"
    #      is ambiguous between ET and UTC. Running every hour covers 06:00 ET
    #      (10:00 UTC) and 06:00 UTC alike without having to guess, and leaves
    #      the manifest at most an hour stale whenever the book goes away.
    #
    # This is cheap: one authenticated GET and a commit that carries
    # [skip ci] and touches nothing the deploy branch watches.
    - cron: "20 23 * * *"      # 19:20 ET
    - cron: "20 0-11 * * *"    # hourly overnight, through 07:20 ET
  push:
    branches: [main]
    paths:
      - .github/workflows/maint_snapshot.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maint-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log every resting order
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          pip install -q -r requirements.txt
          python3 - <<'EOF'
          import json, os, datetime, collections, requests
          import track_rewards as tr
          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]

          r = requests.get(tr.TRADE_API + "/v1/orders/open",
                           headers=tr.auth_headers(kid, sec, "GET", "/v1/orders/open"),
                           timeout=30)
          r.raise_for_status()
          orders = r.json().get("orders") or []
          now = datetime.datetime.now(datetime.timezone.utc)

          manifest = []
          for o in orders:
              slug = o.get("marketSlug") or (o.get("marketMetadata") or {}).get("slug") or ""
              if not slug:
                  continue
              manifest.append({
                  "market": slug,
                  "side": "BUY" if str(o.get("side", "")).upper().endswith("BUY") else "SELL",
                  # price kept as the API's own STRING — re-placing with a float
                  # is rejected with a bare 400
                  "price": str((o.get("price") or {}).get("value")),
                  "quantity": int(round(tr._num(o.get("leavesQuantity"))
                                        or tr._num(o.get("quantity")) or 0)),
                  "intent": o.get("intent"),
                  "id": o.get("id"),
              })
          manifest = [m for m in manifest if m["quantity"] >= 1]
          out = {"taken_at": now.isoformat(), "count": len(manifest), "orders": manifest}
          by = collections.Counter(m["market"] for m in manifest)
          print(f"live right now: {len(manifest)} resting orders across {len(by)} markets")

          # A snapshot is a restore TARGET, so a later run must never be allowed
          # to overwrite a richer one with a poorer one. Orders can vanish for
          # reasons that have nothing to do with us — the exchange pulling the
          # book ahead of a window, a mass cancel — and if that happens between
          # two scheduled runs, the naive "last write wins" throws away the very
          # baseline we are trying to preserve and quietly shrinks the restore
          # to whatever survived.
          #
          # So: keep the high-water mark for the day. A run that sees fewer
          # orders writes itself to a side file and leaves the baseline alone.
          prev = None
          try:
              with open("data/maint_orders.json") as f:
                  prev = json.load(f)
          except Exception:
              pass

          same_day = bool(prev) and str(prev.get("taken_at", ""))[:10] == now.date().isoformat()
          if same_day and prev.get("count", 0) > len(manifest):
              with open("data/maint_orders_late.json", "w") as f:
                  json.dump(out, f, indent=1)
              print(f"!! REFUSING to overwrite the baseline: it holds "
                    f"{prev['count']} orders (taken {prev['taken_at']}), this run sees "
                    f"{len(manifest)}. {prev['count'] - len(manifest)} orders left the book "
                    f"since then.")
              print("   baseline kept in data/maint_orders.json — restore against that.")
              print("   this run written to data/maint_orders_late.json for reference.")
          else:
              with open("data/maint_orders.json", "w") as f:
                  json.dump(out, f, indent=1)
              print(f"baseline updated: {len(manifest)} orders across {len(by)} markets")

          EOF

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # only the manifest — this job must never touch the defend config
          git add data/maint_orders.json data/maint_orders_late.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Pre-maintenance snapshot [skip ci]"
            git pull --rebase origin main
            git push
          fi
