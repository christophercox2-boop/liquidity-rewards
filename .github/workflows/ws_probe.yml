name: WebSocket probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ws_probe.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ws-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Docs index + websocket pages
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          curl -sSL -A "$UA" "https://docs.polymarket.us/llms.txt" -o /tmp/llms.txt || true
          echo "== llms.txt head =="; head -50 /tmp/llms.txt || true
          # pull every page that mentions websockets/streams, as markdown when possible
          python3 - <<'EOF'
          import re, subprocess
          try:
              idx = open("/tmp/llms.txt", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              idx = ""
          urls = re.findall(r"https?://docs\.polymarket\.us[^\s)\"]*", idx)
          keep = [u for u in urls if re.search(r"websocket|stream|market-data|ws", u, re.I)]
          print("candidate pages:", keep[:10])
          out = []
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for u in list(dict.fromkeys(keep))[:6]:
              for variant in (u + ".md", u):
                  r = subprocess.run(["curl", "-sSL", "-A", UA, variant],
                                     capture_output=True, text=True, timeout=30)
                  if r.returncode == 0 and len(r.stdout) > 200:
                      out.append(f"\n\n===== {variant} =====\n" + r.stdout[:20000])
                      break
          open("data/probe_ws_docs.txt", "w").write("".join(out) or idx[:20000] or "FETCH FAILED")
          EOF

      - name: Authenticated connect to the markets stream
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          pip install -q -r requirements.txt websockets
          python3 - <<'EOF'
          import asyncio, csv, json, os, time
          import websockets
          import track_rewards as tr
          kid = os.environ["POLYMARKET_KEY_ID"]; sec = os.environ["POLYMARKET_SECRET_KEY"]
          slugs = []
          try:
              with open("data/live_orders.csv") as f:
                  for row in csv.DictReader(f):
                      if row["market"] not in slugs:
                          slugs.append(row["market"])
          except Exception:
              pass
          slugs = slugs[:5] or ["scc-senate-gop-2026-11-03-52"]
          URL = "wss://api.polymarket.us/v1/ws/markets"
          PATH = "/v1/ws/markets"
          out = {"url": URL, "slugs": slugs, "connected": False, "messages": []}
          async def main():
              headers = tr.auth_headers(kid, sec, "GET", PATH)
              async with websockets.connect(URL, additional_headers=headers,
                                            open_timeout=10, close_timeout=3) as ws:
                  out["connected"] = True
                  await ws.send(json.dumps({"subscribe": {
                      "requestId": "md-1",
                      "subscriptionType": "SUBSCRIPTION_TYPE_MARKET_DATA",
                      "marketSlugs": slugs}}))
                  t_end = time.time() + 30
                  while time.time() < t_end and len(out["messages"]) < 40:
                      try:
                          m = await asyncio.wait_for(ws.recv(), timeout=8)
                          out["messages"].append(str(m)[:1500])
                      except asyncio.TimeoutError:
                          out["messages"].append("(recv timeout)")
                          break
          try:
              asyncio.run(main())
          except Exception as e:
              out["error"] = f"{type(e).__name__}: {e}"[:300]
          json.dump(out, open("data/probe_ws_connect.json", "w"), indent=1)
          print("connected:", out["connected"], "| messages:", len(out["messages"]),
                "| error:", out.get("error", "-"))
          for m in out["messages"][:3]:
              print("  ", m[:200])
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_ws_docs.txt data/probe_ws_connect.json
          git commit -m "WebSocket probe [skip ci]" || echo "no changes"
          # Several workflows push to this repo at once. A lost race used to
          # fail the step and throw the run's output away — retry instead.
          pushed=""
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then pushed=yes; break; fi
            echo "push race lost (attempt $attempt) — retrying"
            sleep $((attempt * 3))
          done
          if [ -z "$pushed" ]; then echo "push failed after 5 attempts"; exit 1; fi