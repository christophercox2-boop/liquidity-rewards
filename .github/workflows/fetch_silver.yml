name: Fetch Silver model

# Pulls Silver Bulletin's Senate forecast series and commits them. The session
# that requested this cannot reach static.dwcdn.net -- the egress proxy blocks
# it -- but Actions runners have open internet, so the fetch happens here and
# the data lands in the repo for analysis.
#
# The owner's link was KQI8W. Reading the chart page showed it is one of four
# related series behind the same widget's toggles, so all four are pulled:
# three model variants of the same win probability, plus the average seat
# count. The seat mean is a second, independent anchor on the same underlying
# distribution as the win probability, which makes the ladder check far more
# informative than either number alone.
#
# Read-only with respect to the exchange: touches no orders.
#
# 2026-08-17: THIS IS NO LONGER LOAD-BEARING. The monitor fetches the two
# per-race series from the CDN itself every six hours and commits them back to
# main (live/monitor.py, _silver_fetch), so the guards keep a fresh fallback
# whether or not Actions ever dispatches again. It stopped dispatching on
# 2026-08-16 03:34 and the committed copy froze at 08-15 12:56 while every
# guard reading it carried on unaware — which is the reason for the change.
#
# Left in place because it still pulls the four SENATE-WIDE series (win
# probability variants and the seat mean) that the monitor does not, and
# because it is the recovery path if the droplet ever loses CDN egress. When
# both run, the monitor commits only on a real change, so there is no fight.

on:
  schedule:
    - cron: "10 12 * * *"      # 08:10 ET, once a day
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch_silver.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-silver
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        run: |
          pip install -q requests
          python3 - <<'EOF'
          import csv, io, json, os, re, requests

          # chart id -> (filename stem, what the numbers mean)
          SERIES = {
              "KQI8W": ("silver_model",         "Senate win probability, Deluxe model"),
              "igTt2": ("silver_senate_classic","Senate win probability, Classic model"),
              "6aks4": ("silver_senate_lite",   "Senate win probability, Lite model"),
              "6mA2E": ("silver_senate_seats",  "Senate average seats, Deluxe model"),
              "kNspD": ("silver_senate_races",  "per-race Senate win probability"),
              "3DsnL": ("silver_gov_races",     "per-race Governor win probability"),
          }
          UA = {"User-Agent": "Mozilla/5.0 (liquidity-rewards data pull)"}
          os.makedirs("data", exist_ok=True)
          meta = {}

          # a CSV alone never says what its columns mean, so read each chart's
          # own title too rather than inferring it from the numbers
          def chart_title(cid, depth=0, url=None):
              url = url or f"https://datawrapper.dwcdn.net/{cid}/"
              try:
                  r = requests.get(url, timeout=45, headers=UA)
              except Exception:
                  return None
              if r.status_code >= 400:
                  return None
              if depth < 4 and len(r.text) < 2000:
                  m = re.search(r"url=(https://datawrapper\.dwcdn\.net/[^\"'>\s]+)", r.text)
                  if m:
                      return chart_title(cid, depth + 1, m.group(1).rstrip("+' "))
              m = re.search(r'<meta property="og:title" content="([^"]+)"', r.text)
              return m.group(1) if m else None

          for cid, (stem, meaning) in SERIES.items():
              url = f"https://static.dwcdn.net/data/{cid}.csv"
              try:
                  r = requests.get(url, timeout=60, headers=UA)
              except Exception as e:
                  print(f"{cid}: {type(e).__name__}: {e}")
                  continue
              print(f"{cid} -> HTTP {r.status_code}  {len(r.content):,} bytes  ({meaning})")
              if r.status_code >= 400:
                  continue
              with open(f"data/{stem}.csv", "w") as f:
                  f.write(r.text)
              rows = list(csv.reader(io.StringIO(r.text)))
              title = chart_title(cid)
              meta[cid] = {"url": url, "file": f"data/{stem}.csv", "meaning": meaning,
                           "chart_title": title, "n_rows": len(rows),
                           "header": rows[0] if rows else [],
                           "latest": rows[-1] if len(rows) > 1 else []}
              print(f"    chart title: {title}")
              print(f"    header={rows[0] if rows else []}")
              for row in rows[:6]:
                  print(f"      {row[:12]}")
              if len(rows) > 8:
                  print(f"      ... {len(rows)-6} more rows")
                  print(f"      last: {rows[-1][:12]}")

          json.dump(meta, open("data/silver_model_meta.json", "w"), indent=1)
          print(f"\nwrote {len(meta)} series")
          EOF

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/silver_*.csv data/silver_model_meta.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Fetch Silver model [skip ci]"
            # Several workflows push to this repo at once. A lost race used to
            # fail the step and throw the run's output away — retry instead.
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then pushed=yes; break; fi
              echo "push race lost (attempt $attempt) — retrying"
              sleep $((attempt * 3))
            done
            if [ -z "$pushed" ]; then echo "push failed after 5 attempts"; exit 1; fi
          fi
