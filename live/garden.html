<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Garden</title>
<meta name="theme-color" content="#1A2230">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1A2230}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
  .wd{font-family:ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN','Comfortaa','Segoe UI',sans-serif;
    font-weight:700;color:#F6E3C1;border:2px solid #3E2A18;border-radius:14px;
    background:linear-gradient(#7D5030,#5E3D24);box-shadow:0 6px 16px rgba(40,25,10,.4);
    padding:9px 16px}
  #hint{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    font-size:12px;z-index:10;opacity:0;transition:opacity .8s;pointer-events:none;white-space:nowrap}
  #hint.show{opacity:.95}
  #cap{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) rotate(-.4deg);
    font-size:13px;z-index:10;opacity:0;transition:opacity .4s;pointer-events:none;max-width:86vw;
    text-align:center;line-height:1.45}
  #cap.show{opacity:1}
  #toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%) rotate(-.6deg);font-size:13px;z-index:30;opacity:0;
    transition:opacity .4s;pointer-events:none;max-width:86vw;text-align:center;line-height:1.4}
  #toast.show{opacity:1}
  #back{position:fixed;top:calc(14px + env(safe-area-inset-top));left:12px;z-index:11;
    font-size:12px;cursor:pointer;display:none;padding:8px 13px}
  #back.show{display:block}
  #dash{position:fixed;top:calc(14px + env(safe-area-inset-top));right:12px;z-index:10;
    font-size:11px;padding:6px 10px;cursor:pointer;opacity:.9;text-decoration:none}
  #panel{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));z-index:12;
    transform:translateX(-50%);width:min(94vw,440px);display:none;
    transition:transform .35s ease;max-height:62vh;overflow-y:auto;border-radius:18px;
    font-family:ui-rounded,'SF Pro Rounded','Comfortaa','Segoe UI',sans-serif}
  #panel.show{display:block}
  #panel.dip{transform:translateX(-50%) translateY(170%)}
  .board{background:linear-gradient(#7D5030,#5E3D24);border:2px solid #3E2A18;border-radius:18px;
    box-shadow:0 10px 28px rgba(30,18,8,.5);padding:13px 15px;color:#F6E3C1}
  .pmkt{font-size:14.5px;font-weight:800;color:#FFE2AE;line-height:1.3}
  .ptier{font-size:11.5px;color:#D9C49A;margin:3px 0 8px}
  .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .prow{display:flex;align-items:center;gap:6px;margin:8px 0;font-size:14px;font-weight:700}
  .prow .lab{width:34px;font-size:11px;letter-spacing:1px;color:#D9C49A}
  .pv{min-width:48px;text-align:center;background:#4E3018;border:2px solid #3E2A18;border-radius:9px;
    padding:5px 2px;font-size:14px}
  .pv.chg{color:#FFD25A;border-color:#C77F1B}
  .st{width:36px;height:34px;background:linear-gradient(#9A6A38,#7D5030);border:2px solid #3E2A18;
    border-radius:10px;color:#F6E3C1;font-size:16px;font-weight:700;cursor:pointer;padding:0;
    font-family:inherit}
  .st:active{transform:translateY(1px);filter:brightness(.9)}
  .pbtns{display:flex;gap:8px;margin-top:11px}
  .pb{flex:1;border:2px solid #3E2A18;border-radius:12px;padding:10px 6px;font-family:inherit;
    font-weight:800;font-size:12.5px;color:#2E2418;background:linear-gradient(#FFC65C,#F2A93B);
    cursor:pointer;box-shadow:0 3px 8px rgba(30,18,8,.3)}
  .pb.green{background:linear-gradient(#93D072,#6FAE52)}
  .pb.rose{background:linear-gradient(#F07A6E,#DE5145);color:#FFF}
  .pb:active{transform:translateY(1px)}
  .pb[disabled]{opacity:.45;pointer-events:none}
  .pnote{font-size:11.5px;color:#D9C49A;margin-top:6px;line-height:1.5}
  .bk{margin:6px 0 2px}
  .bkh{font-size:10px;letter-spacing:1.2px;color:#C8B48E;margin:0 0 4px;font-weight:800}
  .bkr{display:flex;align-items:center;gap:6px;height:20px;font-size:12px;font-weight:700;
    padding:0 3px;border-radius:7px}
  .bkr.pend{outline:2px solid #FFD25A;outline-offset:-2px;background:rgba(255,210,90,.13)}
  .bkpx{width:40px;text-align:right}
  .bkpx.front{color:#FFE2AE}
  .bkbar{flex:1;height:11px;background:#4E3018;border-radius:6px;overflow:hidden;display:flex}
  .bkf{background:#C25A50;flex:0 0 auto}
  .bkf.bid{background:#66A354}
  .bkyou{background:#F2A93B;flex:0 0 auto}
  .bkq{width:46px;text-align:right;font-size:11px;color:#D9C49A}
  .bkchip{font-size:10px;background:#F2A93B;color:#2E2418;padding:1px 5px;font-weight:800;
    border-radius:6px}
  .bkmid{display:flex;align-items:center;justify-content:center;gap:8px;color:#C8B48E;
    font-size:10px;letter-spacing:2px;height:16px}
  .bkmid::before,.bkmid::after{content:'';flex:1;border-top:1.5px dashed #8A5C2E}
  #gate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(20,16,10,.75)}
  #gate.show{display:flex}
  .gatebox{width:min(86vw,340px);text-align:center;padding:22px 18px}
  .gatebox input{width:100%;box-sizing:border-box;margin-top:12px;padding:11px;border-radius:10px;
    border:2px solid #3E2A18;background:#4E3018;color:#F6E3C1;font-size:15px;text-align:center;
    font-family:inherit}
  .gatebox button{margin-top:12px;width:100%}
</style></head>
<body>
<canvas id="g"></canvas>
<div id="hint" class="wd">turn to look around &middot; tap a bed to open it</div>
<div id="cap" class="wd"></div>
<div id="toast" class="wd"></div>
<button id="back" class="wd">&larr; step back</button>
<a id="dash" class="wd" href="/">dashboard</a>
<div id="panel"><div class="board" id="pboard"></div></div>
<div id="gate"><div class="gatebox wd"><div style="font-size:15px">the garden gate is locked</div>
  <input id="gkey" type="password" placeholder="garden key" autocomplete="current-password">
  <button class="pb green" onclick="unlock()">open the gate</button></div></div>
<script>
'use strict';
// safe-area probe: canvas-drawn chrome must clear the phone notch
const _sp = document.createElement('div');
_sp.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0px);left:0;width:0;height:0;pointer-events:none';
document.body.appendChild(_sp);
function safeTop(){ return _sp.getBoundingClientRect().top || 0; }
// ================================================================
//  THE GARDEN — live. Every plant is one of your real markets;
//  its health is your real standing in the book. Tending a row
//  sends real orders through the same guarded endpoints as the
//  dashboard. Day and night follow the actual clock in ET.
// ================================================================
const cv = document.getElementById('g'), ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let SW, SH, CX, F, HOR0, DPR;

function mulb(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 9; for(const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 387420489); return h >>> 0; }
function lerp3(a, b, t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgb(c){ return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }
function angNorm(a){ while(a > Math.PI) a -= 2 * Math.PI; while(a < -Math.PI) a += 2 * Math.PI; return a; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------------- auth ----------------
function dashKey(){ return localStorage.getItem('dashKey') || ''; }
function unlock(){
  localStorage.setItem('dashKey', document.getElementById('gkey').value.trim());
  document.getElementById('gate').classList.remove('show');
  refresh(true);
}
async function jget(u){
  const r = await fetch(u, {headers:{'X-Dash-Key': dashKey()}});
  if(r.status === 401){ document.getElementById('gate').classList.add('show'); throw new Error('auth'); }
  if(!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
async function jpost(u, body){
  const r = await fetch(u, {method:'POST',
    headers:{'X-Dash-Key': dashKey(), 'X-Reprice':'1', 'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401){ document.getElementById('gate').classList.add('show'); throw new Error('auth'); }
  if(!r.ok || j.ok === false) throw new Error(j.error || j.detail || ('http ' + r.status));
  return j;
}

// ---------------- market naming (same rules as the dashboard) ----------------
const MTOK = {usse:'Senate', ussep:'Senate primary', usgub:'Governor',
  usgubp:'Governor primary', housepopw:'House popular vote', uspres28:'President 2028',
  hrep:'House', ref:'Referendum', dem:'· Dem', rep:'· Rep', pass:'· passes'};
function mname(m){
  const s = String(m);
  let mm = s.match(/^scc-senate-gop-.*?-(gte|lte)?(\d+)$/);
  if(mm) return 'Senate GOP ' + (mm[1] === 'gte' ? '≥' : mm[1] === 'lte' ? '≤' : '') + mm[2] + ' seats';
  mm = s.match(/^scc-hrep-rep-.*?-(gte|lte)?(\d+)$/);
  if(mm) return 'House GOP ' + (mm[1] === 'gte' ? '≥' : mm[1] === 'lte' ? '≤' : '') + mm[2] + ' seats';
  const parts = s.split('-');
  const out = [];
  for(let i = 1; i < parts.length; i++){
    if(/^\d{4}$/.test(parts[i]) && /^\d{1,2}$/.test(parts[i+1] || '') && /^\d{1,2}$/.test(parts[i+2] || '')){
      i += 2; continue;
    }
    const p = parts[i];
    out.push(MTOK[p] || (p.length === 2 ? p.toUpperCase() : p));
  }
  const t = out.join(' ');
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : s;
}
function famOf(m){
  if(m.startsWith('scc-senate')) return 'senate';
  if(m.startsWith('scc-hrep')) return 'house';
  if(m.startsWith('opdc-')) return 'resign';
  if(m.startsWith('apdc-')) return 'court';
  if(m.startsWith('tec-cbb')) return 'gym';
  return m.split('-')[0];
}
const FAMLBL = {senate:'the senate cornfield', house:'the house tomato field',
  resign:'the resignation patch', court:'the courthouse bed', gym:'the gymnasium orchard',
  pandc:'the science greenhouse', lawec:'the law bed', dccc:'the clinic plot',
  stsc:'the shipping lane', pvwc:'the popular-vote row', vmc:'the primary rows',
  enwc:'the primary rows', ewc:'the referendum row', usgcc:'the odd corner'};

// ---------------- palettes / painters (unchanged storybook art) ----------------
const PAL = {soil:'#7A5233', soilD:'#5A3B22'};
function blobPath(g, pts){
  const n = pts.length;
  g.beginPath();
  g.moveTo((pts[0][0] + pts[n-1][0]) / 2, (pts[0][1] + pts[n-1][1]) / 2);
  for(let i = 0; i < n; i++){
    const p = pts[i], q = pts[(i+1) % n];
    g.quadraticCurveTo(p[0], p[1], (p[0]+q[0]) / 2, (p[1]+q[1]) / 2);
  }
  g.closePath();
}
function blobAt(g, cx, cy, rx, ry, R, lobes, jit){
  const pts = [];
  for(let i = 0; i < lobes; i++){
    const a = i / lobes * Math.PI * 2;
    const rr = 1 - jit / 2 + R() * jit;
    pts.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr]);
  }
  blobPath(g, pts);
}
function shadowE(g, ry, rx){
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
  gr.addColorStop(0, 'rgba(26,36,18,.28)'); gr.addColorStop(1, 'rgba(26,36,18,0)');
  g.save(); g.scale(1, ry / rx);
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, 7); g.fill();
  g.restore();
}
function leafO(g, x, y, len, ang, col){
  g.save(); g.translate(x, y); g.rotate(ang);
  g.beginPath(); g.moveTo(0, 0);
  g.quadraticCurveTo(len * .32, -len * .3, len, 0);
  g.quadraticCurveTo(len * .32, len * .3, 0, 0);
  g.fillStyle = col; g.fill(); g.restore();
}
const TONES_OK  = ['#2F6B2C', '#469140', '#63AE52', '#86C46B'];
const TONES_DRY = ['#7E813F', '#989B54', '#B0B26C', '#C7C887'];
function cornBlade(g, len, side, w, col, crease, droop){
  const tx = side * len * .92, ty = -len * .34 + droop * len * .44;
  g.beginPath();
  g.moveTo(0, -w * .4);
  g.bezierCurveTo(side * len * .16, -len * .52, side * len * .58, -len * .5, tx, ty);
  g.bezierCurveTo(side * len * .52, -len * .26, side * len * .18, -len * .08, 0, w);
  g.closePath();
  g.fillStyle = col; g.fill();
  g.strokeStyle = crease; g.lineWidth = Math.max(.8, w * .22); g.lineCap = 'round';
  g.beginPath(); g.moveTo(side * w * .5, -w * .1);
  g.bezierCurveTo(side * len * .28, -len * .4, side * len * .58, -len * .38, tx, ty);
  g.stroke();
}
function cornEar2(g, k, s, C){
  g.save(); g.rotate(s * .55);
  const L = k * .17, W = k * .055;
  const gr = g.createLinearGradient(-W, 0, W, 0);
  gr.addColorStop(0, '#C6952C'); gr.addColorStop(.5, '#F0C24E'); gr.addColorStop(1, '#F8DC86');
  g.beginPath();
  g.moveTo(-W * .7, 0);
  g.quadraticCurveTo(-W, -L * .55, -W * .35, -L * .95);
  g.quadraticCurveTo(0, -L * 1.08, W * .35, -L * .95);
  g.quadraticCurveTo(W, -L * .55, W * .7, 0);
  g.closePath(); g.fillStyle = gr; g.fill();
  g.fillStyle = 'rgba(150,104,22,.45)';
  for(let r = 0; r < 3; r++) for(let q = -1; q <= 1; q++){
    g.beginPath();
    g.ellipse(q * W * .4 + (r % 2 ? W * .16 : 0), -L * (.6 + r * .14), W * .1, W * .13, 0, 0, 7);
    g.fill();
  }
  g.strokeStyle = '#B0793E'; g.lineWidth = W * .12; g.lineCap = 'round';
  for(let i = -1; i <= 1; i++){
    g.beginPath(); g.moveTo(i * W * .15, -L * 1.0);
    g.quadraticCurveTo(i * W * .5, -L * 1.16, i * W * .72, -L * 1.08); g.stroke();
  }
  g.fillStyle = C[1];
  g.beginPath(); g.moveTo(-W * .75, 0);
  g.quadraticCurveTo(-W * 1.5, -L * .4, -W * .5, -L * .78);
  g.quadraticCurveTo(-W * .5, -L * .28, -W * .12, 0); g.closePath(); g.fill();
  g.fillStyle = C[2];
  g.beginPath(); g.moveTo(W * .75, 0);
  g.quadraticCurveTo(W * 1.4, -L * .35, W * .45, -L * .72);
  g.quadraticCurveTo(W * .45, -L * .24, W * .1, 0); g.closePath(); g.fill();
  g.restore();
}
function drawCorn(g, k, o){
  const R = mulb(o.seed), dry = o.state === 'dry';
  const C = dry ? TONES_DRY : TONES_OK;
  const stemC = dry ? '#8E9450' : '#3F8A3C';
  g.lineJoin = g.lineCap = 'round';
  shadowE(g, k * .05, k * .32);
  const lean = (dry ? .15 : .03) + (o.sway || 0);
  const sx = t => lean * k * t * t * 1.2;
  [[.3, -1], [.46, 1], [.62, -1]].forEach(([t, s]) => {
    g.save(); g.translate(sx(t), -k * t);
    cornBlade(g, k * (.5 - t * .2), s, k * .05, C[0], 'rgba(18,38,14,.4)',
      dry ? 1.15 : .55 + R() * .25);
    g.restore();
  });
  g.beginPath();
  g.moveTo(-k * .024, 0);
  g.quadraticCurveTo(sx(.5) - k * .016, -k * .5, sx(.95) - k * .006, -k * .95);
  g.lineTo(sx(.95) + k * .006, -k * .95);
  g.quadraticCurveTo(sx(.5) + k * .024, -k * .5, k * .028, 0);
  g.closePath(); g.fillStyle = stemC; g.fill();
  g.strokeStyle = 'rgba(18,38,14,.3)'; g.lineWidth = k * .01;
  [.25, .5, .72].forEach(t => {
    g.beginPath(); g.moveTo(sx(t) - k * .018, -k * t);
    g.quadraticCurveTo(sx(t), -k * t - k * .012, sx(t) + k * .018, -k * t); g.stroke();
  });
  const n = o.state === 'ok' ? Math.min(o.fruit, 4) : 0;
  for(let i = 0; i < n; i++){
    const t = .36 + i * .13, s = i % 2 ? 1 : -1;
    g.save(); g.translate(sx(t), -k * t); cornEar2(g, k, s, C); g.restore();
  }
  [[.2, 1], [.38, -1], [.56, 1], [.72, -1]].forEach(([t, s], i) => {
    g.save(); g.translate(sx(t), -k * t);
    cornBlade(g, k * (.52 - t * .22), s, k * .05, i % 2 ? C[2] : C[1],
      'rgba(24,52,18,.35)', dry ? 1.25 : .6 + R() * .3);
    g.restore();
  });
  g.save(); g.translate(sx(.95), -k * .95);
  const tc = dry ? '#B7A868' : '#D9AE45';
  g.strokeStyle = tc; g.lineWidth = k * .01; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -k * .1); g.stroke();
  for(let b = -2; b <= 2; b++){
    if(!b) continue;
    g.beginPath(); g.moveTo(0, -k * .035);
    g.quadraticCurveTo(b * k * .02, -k * .07, b * k * .042, -k * .078 + Math.abs(b) * k * .008);
    g.stroke();
  }
  g.fillStyle = tc;
  for(let d = 0; d < 12; d++){
    const bb = (d % 5) - 2, u = .45 + (d / 12) * .55;
    const x = bb ? bb * k * .042 * u : 0;
    const y = bb ? (-k * .078 + Math.abs(bb) * k * .008) * u - k * .008 : -k * .1 * u;
    g.beginPath(); g.ellipse(x, y, k * .006, k * .011, bb * .3, 0, 7); g.fill();
  }
  g.restore();
}
function tomatoFruit(g, r){
  const gr = g.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r * 1.1);
  gr.addColorStop(0, '#FF9078'); gr.addColorStop(.55, '#E04B3E'); gr.addColorStop(1, '#B23227');
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.fillStyle = gr; g.fill();
  g.fillStyle = 'rgba(255,255,255,.5)';
  g.beginPath(); g.ellipse(-r * .35, -r * .42, r * .24, r * .13, -.6, 0, 7); g.fill();
  g.strokeStyle = '#3E7A36'; g.lineWidth = r * .14; g.lineCap = 'round';
  for(let i = 0; i < 5; i++){
    const a = -Math.PI / 2 + (i - 2) * .55;
    g.beginPath(); g.moveTo(0, -r * .74);
    g.lineTo(Math.cos(a) * r * .4, -r * .74 + Math.sin(a) * r * .26 + r * .28); g.stroke();
  }
}
function drawTomato(g, k, o){
  const R = mulb(o.seed), dry = o.state === 'dry';
  const C = dry ? TONES_DRY : TONES_OK;
  g.lineCap = 'round';
  shadowE(g, k * .06, k * .6);
  const squash = dry ? .82 : 1;
  g.strokeStyle = dry ? '#7E8148' : '#38762F';
  [[-.5, .6], [0, .74], [.48, .58]].forEach(([d, h]) => {
    g.lineWidth = k * .05;
    g.beginPath(); g.moveTo(0, 0);
    g.quadraticCurveTo(d * k * .26, -k * h * .5, d * k * .48, -k * h * squash); g.stroke();
  });
  const clumps = [[-.44, .32, .2], [.42, .34, .19], [0, .3, .22], [-.24, .46, .21],
    [.24, .48, .2], [-.44, .55, .16], [.44, .56, .15], [0, .5, .22],
    [-.14, .64, .17], [.16, .65, .16]];
  clumps.forEach(([x, y, r], i) => {
    blobAt(g, x * k, -y * k * squash, k * r, k * r * .74, R, 8, .38);
    g.fillStyle = [C[0], C[1], C[1], C[2], C[1]][i % 5]; g.fill();
  });
  for(let i = 0; i < 26; i++){
    const lx = (R() - .5) * k * 1.05, ly = -k * (.24 + R() * .5) * squash;
    const ang = Math.atan2(ly + k * .42 * squash, lx) + (R() - .5) * 1.1;
    leafO(g, lx, ly, k * (.13 + R() * .09), ang, [C[0], C[1], C[2], C[3]][i % 4]);
  }
  if(o.state === 'ok') for(let i = 0; i < o.fruit; i++){

let SECTIONS = [], CROPS = [], SIGNS = [];

let DATA = null, EARNED = 0, RATE = 0;
const SOWN = new Set();      // markets sown this session → sprout until orders show
function classify(orders, net){
  if(!orders.length) return Math.abs(net || 0) >= 1 ? 'eaten' : 'eaten';
  let minTicks = null, minShare = null;
  for(const o of orders){
    if(o.ticks != null) minTicks = minTicks == null ? o.ticks : Math.min(minTicks, o.ticks);
    if(o.share != null) minShare = minShare == null ? o.share : Math.min(minShare, o.share);
  }
  if(minTicks != null && minTicks >= 3) return 'thirsty';
  if(minShare != null && minShare < 0.25) return 'weedy';
  return 'healthy';
}
function buildWorld(d, positions){
  DATA = d;
  EARNED = d.earned_today || 0; RATE = d.rate_per_day || 0;
  const byMkt = {};
  (d.orders || []).forEach(o => { (byMkt[o.market] = byMkt[o.market] || []).push(o); });
  const pm = d.per_market_today || {};
  const posRows = (positions && positions.rows) || [];
  const eatenMkts = posRows.filter(r => !byMkt[r.market] && Math.abs(r.net || 0) >= 1)
                           .map(r => r.market);
  // families
  const fams = {};
  Object.keys(byMkt).forEach(m => { (fams[famOf(m)] = fams[famOf(m)] || []).push(m); });
  eatenMkts.forEach(m => { (fams[famOf(m)] = fams[famOf(m)] || []).push(m); });
  let famList = Object.entries(fams).map(([f, ms]) => ({
    f, ms, tot:ms.reduce((s, m) => s + (pm[m] || 0), 0)}));
  famList.sort((a, b) => b.tot - a.tot);
  if(famList.length > 8){
    const rest = famList.slice(7);
    famList = famList.slice(0, 7);
    famList.push({f:'odds', ms:rest.flatMap(x => x.ms), tot:rest.reduce((s, x) => s + x.tot, 0)});
  }
  // tiers by today's earnings rank
  const rates = {};
  Object.entries(byMkt).forEach(([m, os]) => { rates[m] = os.reduce((s, o) => s + (o.est_day || 0), 0); });
  const ranked = Object.keys(byMkt).sort((a, b) => (rates[b] || 0) - (rates[a] || 0));
  const q1 = ranked[Math.floor(ranked.length * .25)], q3 = ranked[Math.floor(ranked.length * .75)];
  const tierOf = m => {
    const r = rates[m] || 0;
    if(!ranked.length) return 'steady';
    if(r >= (rates[q1] || 0) && r > 0.5) return 'prize';
    if(r <= (rates[q3] || 0) || r < 0.05) return 'puny';
    return 'steady';
  };
  const maxPm = Math.max(0.01, ...Object.values(pm));
  // lay out ring — every market becomes a crop; the ring shows the top
  // rows per bed, the overhead bed view shows all of them
  SECTIONS = []; CROPS = []; SIGNS = [];
  const N = famList.length || 1;
  famList.forEach((fam, i) => {
    const az = i / N * Math.PI * 2;
    const kind = FAMKIND[fam.f] || KINDCYCLE[i % KINDCYCLE.length];
    const sec = {az, kind, f:fam.f, label:FAMLBL[fam.f] || ('the ' + fam.f + ' bed'),
      arc:Math.PI * 2 / N * .74, mkts:[],
      tot:fam.ms.reduce((s, m) => s + (pm[m] || 0), 0)};
    SECTIONS.push(sec);
    const ms = fam.ms.slice().sort((a, b) => (pm[b] || 0) - (pm[a] || 0));
    ms.forEach((m, j) => {
      const orders = byMkt[m] || [];
      let state = orders.length ? classify(orders, 0) : 'eaten';
      if(SOWN.has(m)) state = orders.length ? state : 'sprout';
      const tier = orders.length ? tierOf(m) : 'steady';
      const c = {slug:m, kind, sec:i, ring:j < 9,
        state, tier, sizeMul:TIERS[tier].mul,
        fruit:Math.max(1, Math.min(5, Math.round((pm[m] || 0) / maxPm * 5))),
        seed:hash(m), phase:(hash(m) % 97) / 9, wet:0,
        weeds:state === 'weedy' ? [{dx:-.42,dz:.25},{dx:.38,dz:.35},{dx:.02,dz:-.3}] : null,
        critter:state === 'eaten' ? {type:(hash(m) % 2) ? 'bird' : 'rabbit', frame:0} : null,
        defended:(d.defend || []).includes(m)};
      if(c.ring){
        const shown = Math.min(9, ms.length);
        const front = j < Math.min(5, Math.ceil(shown / 2));
        const idx = front ? j : j - Math.min(5, Math.ceil(shown / 2));
        const rowN = front ? Math.min(5, Math.ceil(shown / 2))
                           : shown - Math.min(5, Math.ceil(shown / 2));
        const da = rowN > 1 ? (idx / (rowN - 1) - .5) * Math.PI * 2 / N * .6

        const r = front ? 4.3 : 5.9;

        c.x = Math.sin(az + da) * r; c.z = Math.cos(az + da) * r;
      }else{ c.x = Math.sin(az) * 5; c.z = Math.cos(az) * 5; }
      CROPS.push(c);
      sec.mkts.push(c);
    });
    SIGNS.push({x:Math.sin(az + .38) * 3.4, z:Math.cos(az + .38) * 3.4, kind});
  });
  if(CLOSE){ const c2 = CROPS.find(c => c.slug === CLOSE.c.slug); if(c2) CLOSE.c = c2; }
  if(BEDV){ const s2 = SECTIONS[Math.min(BEDV.si, SECTIONS.length - 1)]; BEDV.sec = s2; layoutBed(); }
}

function tday(){
  try{
    const s = new Date().toLocaleTimeString('en-US', {timeZone:'America/New_York', hour12:false});
    const [h, m] = s.split(':').map(Number);
    return (((h + m / 60) - 5.2) / 24 + 1) % 1;
  }catch(e){ return .3; }
}
function daylight(){
  const t = tday();
  if(t < .08) return t / .08 * .5;
  if(t < .14) return .5 + (t - .08) / .06 * .5;
  if(t < .58) return 1;
  if(t < .66) return 1 - (t - .58) / .08 * .5;
  if(t < .72) return .5 - (t - .66) / .06 * .5;
  return 0;
}
let Feff;
function proj(wx, wz, wy){
  const cs = Math.cos(P.yaw), sn = Math.sin(P.yaw);
  const xc = wx * cs - wz * sn, zc = wx * sn + wz * cs;
  if(zc < .2) return null;
  const s = Feff / zc;
  return {x:CX + xc * s, y:hor() + (EYE - (wy || 0)) * s, s, zc};
}
function hor(){ return HOR0 + P.pitch * (SH / 420); }
function haze(zc){ return Math.max(.3, Math.min(1, 1.3 - zc / 30)); }

    ((side === 'bid' ? MI.bids : MI.asks) || []).slice(0, 5).forEach(([p, q]) =>
      map.set(Math.round(p * 1000), {tot:q, inBook:true}));

      const mine = myAt[api + k] || 0;

// ---------------- update ----------------
function update(dt){
  fadeIn = Math.min(1, fadeIn + dt * .5);
  if(P.yawT !== null){
    const da = angNorm(P.yawT - P.yaw);
    if(Math.abs(da) < .02) P.yawT = null; else P.yaw += da * Math.min(1, dt * 7);
  }
  if(MODE === 'fly'){
    ZOOM = Math.min(1, ZOOM + dt * 3.0);
    if(ZOOM >= 1 && P.yawT === null) MODE = 'bed';
  }
  if(MODE === 'bed'){
    BEDFADE = Math.min(1, BEDFADE + dt * 4);
    if(BEDV && BEDV.scrollT !== null && BEDV.scrollT !== undefined){
      BEDV.scroll += (BEDV.scrollT - BEDV.scroll) * Math.min(1, dt * 8);
      if(Math.abs(BEDV.scrollT - BEDV.scroll) < 1) BEDV.scrollT = null;
    }
  }
  if(MODE === 'flyout'){
    BEDFADE = Math.max(0, BEDFADE - dt * 4);
    if(BEDFADE <= 0){
      ZOOM = Math.max(0, ZOOM - dt * 3.0);
      if(ZOOM <= 0){ MODE = 'pan'; BEDV = null; }
    }
  }
  if(ACT){
    ACT.t += dt;
    const c = ACT.c;
    const cell = BEDV && BEDV.cells.find(cl => cl.c === c);
    const tx = cell ? cell.x : CX;
    const ty = cell ? cell.y - (BEDV ? BEDV.scroll : 0) : SH * .4;
    if(ACT.kind === 'water' && ACT.t > .3 && ACT.t < ACT.dur - .4 && Math.random() < .9)
      PARTS.push({kind:'drop', u:0, sx:tx + SW * .16, sy:ty - SH * .07,
        tx:tx + (Math.random() - .5) * SW * .14, ty:ty + 8, life:1});
    if(ACT.kind === 'plant' && ACT.t > .5 && ACT.t < ACT.dur - .6 && Math.random() < .8)
      PARTS.push({kind:'seed', x:tx - 30 + Math.random() * 60, y:ty + SH * .2,
        vx:(Math.random() - .5) * 110, vy:-SH * .2 - Math.random() * 50, life:1});
    if(ACT.kind === 'weedall' && c.weeds){
      const due = c.weeds.filter((w, i) => ACT.t > .4 + i * .3 && !w._pulled);
      due.forEach((w, i) => { w._pulled = true;
        const wx = tx + (i - 1) * 30, wy = ty + 20;
        PARTS.push({kind:'weedfly', x:wx, y:wy,
          vx:(Math.random() - .5) * 100 - 30, vy:-SH * .3, rot:0, life:1});
        for(let j = 0; j < 7; j++) PARTS.push({kind:'crumb',
          x:wx + (Math.random() - .5) * 34, y:wy,
          vx:(Math.random() - .5) * 140, vy:-100 - Math.random() * 100, life:.8});
      });
    }
    if(ACT.t > ACT.dur && !ACT.hold) ACT = null;
    if(ACT && ACT.t > ACT.dur) ACT.t = ACT.dur;   // hold the pose while awaiting the server
  }
  CROPS.forEach(c => { if(c.wet > 0) c.wet = Math.max(0, c.wet - dt / 60); });
  FLEES.forEach(f => { f.t += dt;
    if(f.sx !== undefined){ f.sx += dt * SW * 1.1; f.sy -= dt * SH * .5; } });
  FLEES = FLEES.filter(f => f.t < 1.2);
  PARTS.forEach(p => {
    if(p.kind === 'drop'){ p.u += dt * 1.6; }
    else{ p.x += p.vx * dt; p.y += p.vy * dt; p.vy += SH * .6 * dt; p.life -= dt;
      if(p.rot !== undefined) p.rot += dt * 6; }
  });
  PARTS = PARTS.filter(p => p.kind === 'drop' ? p.u < 1.05 : p.life > 0);
  SPARKS.forEach(s => s.life -= dt); SPARKS = SPARKS.filter(s => s.life > 0);
  BFLIES.forEach(b => { b.t += dt; b.az += Math.sin(b.t * .6) * dt * .12;
    b.y = .55 + Math.sin(b.t * 1.7) * .25; });

    f.y += Math.cos(f.t * 1.1) * dt * .15; f.y = Math.max(.2, Math.min(1.3, f.y)); });
}
function spark(c){

const SKYK = [
  [.00, [24,30,58],   [38,46,80],    [70,64,92]],
  [.06, [46,54,96],   [92,86,120],   [212,140,110]],
  [.12, [95,151,196], [168,204,214], [244,217,166]],
  [.35, [88,158,210], [160,208,224], [214,232,224]],
  [.58, [95,151,196], [168,204,214], [244,217,166]],
  [.645,[70,80,130],  [150,110,120], [240,150,96]],
  [.70, [30,36,70],   [50,56,96],    [96,78,104]],
  [.76, [16,22,46],   [26,32,60],    [44,48,76]],
  [1.0, [24,30,58],   [38,46,80],    [70,64,92]],
];
function skyCols(){
  const t = tday();
  for(let i = 0; i < SKYK.length - 1; i++){
    if(t >= SKYK[i][0] && t <= SKYK[i + 1][0]){
      const u = (t - SKYK[i][0]) / (SKYK[i + 1][0] - SKYK[i][0]);
      return [lerp3(SKYK[i][1], SKYK[i + 1][1], u), lerp3(SKYK[i][2], SKYK[i + 1][2], u),
              lerp3(SKYK[i][3], SKYK[i + 1][3], u)];
    }
  }
  return [SKYK[0][1], SKYK[0][2], SKYK[0][3]];
}
function grassCols(){
  const L = daylight();
  const day = [[128,180,98],[86,130,68]], night = [[38,58,52],[24,40,36]];
  return [lerp3(night[0], day[0], L), lerp3(night[1], day[1], L)];
}
function hillY(az, layer){
  return (layer ? 12 : 26) * (SH / 420) *
    (Math.sin(az * (layer ? 1.4 : 2.3) + layer * 2) * .5 +
     Math.sin(az * (layer ? 3.1 : 5.7)) * .25 + .9);
}
function skyAndBodies(h){
  const [top, mid, low] = skyCols();
  const gr = ctx.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, rgb(top)); gr.addColorStop(.55, rgb(mid)); gr.addColorStop(1, rgb(low));
  ctx.fillStyle = gr; ctx.fillRect(0, 0, SW, Math.max(0, h));
  const t = tday(), L = daylight();
  if(L < .5){
    const a = (0.5 - L) * 2;
    STARS.forEach(s => {
      const x = CX + angNorm(s.az - P.yaw) * Feff;
      const y = h - s.dy * (SH / 420) + P.pitch * .2;
      if(x < -4 || x > SW + 4 || y < 0 || y > h) return;
      const tw = .4 + .6 * Math.abs(Math.sin(T * .001 + s.tw));
      ctx.globalAlpha = a * tw;
      ctx.fillStyle = '#E8ECF6';
      if(s.big){ ctx.fillRect(x - 2.5, y - .7, 5, 1.4); ctx.fillRect(x - .7, y - 2.5, 1.4, 5); }
      else ctx.fillRect(x - 1, y - 1, 2, 2);
    });
    ctx.globalAlpha = 1;
  }
  if(t > .02 && t < .68){
    const prog = (t - .02) / .66;
    const az = -2.3 + prog * 4.6, dy = (16 + Math.sin(prog * Math.PI) * 150) * (SH / 420);
    const x = CX + angNorm(az - P.yaw) * Feff, y = h - dy;
    if(x > -120 && x < SW + 120){
      const warm = prog < .12 || prog > .85;
      const gr2 = ctx.createRadialGradient(x, y, 4, x, y, SW * .3);
      gr2.addColorStop(0, warm ? 'rgba(255,196,140,.9)' : 'rgba(255,244,208,.9)');
      gr2.addColorStop(1, 'rgba(255,244,208,0)');
      ctx.fillStyle = gr2; ctx.fillRect(x - SW * .32, y - SW * .32, SW * .64, SW * .64);
      ctx.fillStyle = warm ? '#FFD9A0' : '#FFF6D2';
      ctx.beginPath(); ctx.arc(x, y, SW * .045, 0, 7); ctx.fill();
    }
  }
  if(t > .66 || t < .1){
    const nt = t > .66 ? (t - .66) : (t + .34);
    const prog = nt / .44;
    const az = 2.3 - prog * 4.6, dy = (20 + Math.sin(prog * Math.PI) * 140) * (SH / 420);
    const x = CX + angNorm(az - P.yaw) * Feff, y = h - dy, r = SW * .04;
    if(x > -60 && x < SW + 60){
      const gr2 = ctx.createRadialGradient(x, y, 2, x, y, r * 4);
      gr2.addColorStop(0, 'rgba(232,236,246,.35)'); gr2.addColorStop(1, 'rgba(232,236,246,0)');
      ctx.fillStyle = gr2; ctx.fillRect(x - r * 4, y - r * 4, r * 8, r * 8);
      ctx.fillStyle = '#EDEBDC';
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(180,178,166,.5)';
      ctx.beginPath(); ctx.arc(x - r * .3, y - r * .2, r * .22, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * .25, y + r * .3, r * .16, 0, 7); ctx.fill();
    }
  }
  CLOUDS.forEach(c => {
    const x = CX + angNorm(c.a - P.yaw) * Feff, y = h - c.dy * (SH / 420);
    if(x < -140 || x > SW + 140) return;
    const w = c.w * (SW / 250);
    ctx.globalAlpha = .85 * Math.max(.3, L);
    ctx.fillStyle = L > .5 ? '#FFF6E4' : '#9AA2BE';
    ctx.beginPath();
    ctx.arc(x - w * .35, y, w * .3, 0, 7);
    ctx.arc(x, y - w * .18, w * .4, 0, 7);
    ctx.arc(x + w * .38, y, w * .32, 0, 7);
    ctx.arc(x, y + w * .05, w * .34, 0, 7);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}
function hillsAndTrees(h){
  const L = daylight();
  for(const layer of [0, 1]){
    const col = layer
      ? rgb(lerp3([60,84,58], [126,168,104], L))
      : rgb(lerp3([48,70,52], [148,186,124], L));
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, h + 2);
    for(let sx = 0; sx <= SW; sx += 14){
      const az = P.yaw + (sx - CX) / Feff;
      ctx.lineTo(sx, h - hillY(az, layer));
    }
    ctx.lineTo(SW, h - hillY(P.yaw + (SW - CX) / Feff, layer));
    ctx.lineTo(SW, h + 2); ctx.closePath(); ctx.fill();
  }
  TREES.forEach(tr => {
    const x = CX + angNorm(tr.az - P.yaw) * Feff;
    if(x < -60 || x > SW + 60) return;
    const az = P.yaw + (x - CX) / Feff;
    const y = h - hillY(az, tr.tone === 'far' ? 0 : 1) + 2;
    const k = tr.s * SW * (tr.tone === 'far' ? .05 : .085);
    ctx.save(); ctx.translate(x, y);
    ctx.globalAlpha = fadeIn * (tr.tone === 'far' ? .85 : 1);
    drawTreeV(ctx, k, tr.type, tr.tone, Math.round(tr.az * 997));
    ctx.restore(); ctx.globalAlpha = 1;
  });
}
function ent(wx, wz, worldH, wf, drawFn, opts){
  const p = proj(wx, wz, 0); if(!p) return null;
  const k = worldH * p.s;
  const w = k * wf;
  if(p.x < -w || p.x > SW + w || k <= 0) return null;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.globalAlpha = haze(p.zc) * (opts && opts.alpha !== undefined ? opts.alpha : 1) * fadeIn;
  drawFn(ctx, k, opts || {});
  ctx.restore(); ctx.globalAlpha = 1;
  return {x:p.x - w / 2, y:p.y - k, w, h:k, zc:p.zc, px:p.x, py:p.y, s:p.s, k};
}
function cropOpts(c){

function drawPan(){

  const gg = ctx.createLinearGradient(0, h, 0, SH);

    const half = sec.arc / 2;
    const pts = [];
    for(let i = 0; i <= 6; i++) pts.push([sec.az - half + i * sec.arc / 6, 3.6]);
    for(let i = 6; i >= 0; i--) pts.push([sec.az - half + i * sec.arc / 6, 6.6]);
    const pp = pts.map(([a, r]) => proj(Math.sin(a) * r, Math.cos(a) * r, 0));
    sec._r = null;
    if(pp.some(p => !p)) return;

    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const y0 = Math.min(...ys), y1 = Math.max(...ys);
    sec._r = {x:x0, y:y0, w:x1 - x0, h:y1 - y0};

      ctx.beginPath();

      for(let i = 0; i <= 8; i++){
        const a = sec.az - half * .9 + i * sec.arc * .9 / 8;
        const p = proj(Math.sin(a) * rr, Math.cos(a) * rr, 0);
        if(!p){ started = false; continue; }

    ctx.beginPath(); ctx.ellipse(p.x, p.y, .55 * p.s, .2 * p.s, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }});
  for(let i = 0; i < POSTS.length; i++){
    const a = POSTS[i], b = POSTS[(i + 1) % POSTS.length];
    for(const hh of [.35, .62]){
      const pa = proj(a.x, a.z, hh), pb = proj(b.x, b.z, hh);
      if(pa && pb){
        ctx.globalAlpha = haze(Math.min(pa.zc, pb.zc)) * fadeIn;
        ctx.strokeStyle = '#8A5C2E'; ctx.lineWidth = Math.max(1.5, .045 * Math.max(pa.s, pb.s));
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
  const ents = [];
  POSTS.forEach(p => ents.push({d:Math.hypot(p.x, p.z), fn(){
    ent(p.x, p.z, .8, .3, (g, k) => drawPostV(g, k)); }}));
  SIGNS.forEach(s => ents.push({d:Math.hypot(s.x, s.z), fn(){
    ent(s.x, s.z, .6, 1.4, (g, k) => drawSignV(g, k, s.kind)); }}));
  TUFTS.forEach(t => ents.push({d:Math.hypot(t.x, t.z), fn(){
    ent(t.x, t.z, .16, 1.4, (g, k) => drawTuftV(g, k, t.seed)); }}));
  CROPS.forEach(c => ents.push({d:Math.hypot(c.x, c.z), fn(){ drawCropPan(c); }}));
  if(L > .35) BFLIES.forEach(b => ents.push({d:b.r, fn(){
    const p = proj(Math.sin(b.az) * b.r, Math.cos(b.az) * b.r, b.y); if(!p) return;
    ctx.save(); ctx.translate(p.x, p.y);

    const p = proj(s.c.x + s.dx, s.c.z + s.dz, s.dy); if(!p) return;
    const k = Math.max(2, .05 * p.s);

    ctx.moveTo(p.x, p.y - k * 1.6); ctx.quadraticCurveTo(p.x + k * .3, p.y - k * .3, p.x + k * 1.6, p.y);
    ctx.quadraticCurveTo(p.x + k * .3, p.y + k * .3, p.x, p.y + k * 1.6);
    ctx.quadraticCurveTo(p.x - k * .3, p.y + k * .3, p.x - k * 1.6, p.y);
    ctx.quadraticCurveTo(p.x - k * .3, p.y - k * .3, p.x, p.y - k * 1.6);
    ctx.fill(); ctx.globalAlpha = 1;
  }}));
  ents.sort((a, b) => b.d - a.d);
  ents.forEach(e => e.fn());
  if(L < .45){
    const a = (0.45 - L) / .45;

      const p = proj(Math.sin(f.az) * f.r, Math.cos(f.az) * f.r, f.y); if(!p) return;

function drawBed(){

    if(!RM && c.state === 'healthy') ctx.rotate(Math.sin(T * .0012 + c.phase) * .02);
    if(c.state === 'eaten')
      drawPix(ctx, pixSprite('mound', 28, (gg, kk) => { gg.translate(0, -kk * .3); drawMoundV(gg, kk); }),
        0, cell.r * .55, cell.r * 1.2);
    else if(c.state === 'sprout') drawCropSprite(ctx, 0, 0, cell.r * 1.5, c.kind, 1, false);
    else drawCropSprite(ctx, 0, 0, cell.r * 2.6 * (c.sizeMul || 1), c.kind,
      cropStage(c), c.state === 'thirsty');
    ctx.restore();
    if(c.weeds){
      [[-.6, .4], [.65, .3], [.1, .75]].forEach(([dx, dy], i) => {
        ctx.save(); ctx.translate(cell.x + dx * cell.r, cell.y + dy * cell.r);
        drawWeedsV(ctx, cell.r * .34, c.seed + i * 31);
        ctx.restore();
      });
    }
    if(c.critter){
      c.critter.frame = Math.floor(T / 380) % 2;
      ctx.save(); ctx.translate(cell.x + cell.r * .8, cell.y + cell.r * .35);
      drawPix(ctx, pixSprite(c.critter.type + c.critter.frame, 26,
        (gg, kk) => (c.critter.type === 'bird' ? drawBirdV : drawRabbitV)(gg, kk, c.critter.frame)),
        0, cell.r * .35, cell.r * .95);
      ctx.restore();
    }
    if(c.defended){
      ctx.save(); ctx.translate(cell.x + cell.r * .72, cell.y - cell.r * .6);
      ctx.strokeStyle = '#8A5C2E'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(0, -8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8, -2); ctx.lineTo(8, -2); ctx.stroke();
      ctx.fillStyle = '#E8821E';
      ctx.beginPath(); ctx.arc(0, -12, 6, 0, 7); ctx.fill();
      ctx.restore();
    }
    // name tag
    const tag = tagName(c);
    ctx.font = '700 12px ui-rounded, "SF Pro Rounded", Comfortaa, sans-serif';
    const tw = Math.min(BEDV.cw - 10, ctx.measureText(tag).width + 16);
    const ty = cell.y + cell.r + 14;
    ctx.fillStyle = sel ? '#FFE2AE' : 'rgba(62,42,24,.85)';
    ctx.beginPath(); ctx.roundRect(cell.x - tw / 2, ty - 10, tw, 20, 8); ctx.fill();
    ctx.fillStyle = sel ? '#3E2A18' : '#F6E3C1';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(tag, cell.x, ty + 1, BEDV.cw - 24);
    // sparkles for this crop
    SPARKS.forEach(s => { if(s.c === c){
      const x = cell.x + s.dx * cell.r * 1.2, y = cell.y - s.dy * cell.r * .8;
      const k = 4;
      ctx.globalAlpha = Math.min(1, s.life * 2); ctx.fillStyle = '#FFE9A0';
      ctx.beginPath();
      ctx.moveTo(x, y - k * 1.6); ctx.quadraticCurveTo(x + k * .3, y - k * .3, x + k * 1.6, y);
      ctx.quadraticCurveTo(x + k * .3, y + k * .3, x, y + k * 1.6);
      ctx.quadraticCurveTo(x - k * .3, y + k * .3, x - k * 1.6, y);
      ctx.quadraticCurveTo(x - k * .3, y - k * .3, x, y - k * 1.6);
      ctx.fill(); ctx.globalAlpha = 1;
    }});
  });
  ctx.restore();
  // plank frame
  ctx.strokeStyle = 'rgba(62,42,24,.9)'; ctx.lineWidth = 10;
  ctx.strokeRect(5, 5, SW - 10, SH - 10);
  ctx.strokeStyle = 'rgba(169,116,63,.55)'; ctx.lineWidth = 5;
  ctx.strokeRect(5, 5, SW - 10, SH - 10);
  // header board sits below the top buttons (which clear the notch)
  const hy = safeTop() + 58;
  const hh2 = 56;
  ctx.fillStyle = 'rgba(62,42,24,.95)';
  ctx.beginPath(); ctx.roundRect(12, hy, SW - 24, hh2, 14); ctx.fill();
  const hg = ctx.createLinearGradient(0, hy + 2, 0, hy + hh2);
  hg.addColorStop(0, 'rgba(125,80,48,.95)'); hg.addColorStop(1, 'rgba(94,61,36,.95)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.roundRect(14, hy + 2, SW - 28, hh2 - 4, 12); ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '800 15px ui-rounded, "SF Pro Rounded", Comfortaa, sans-serif';
  ctx.fillStyle = '#FFE2AE';
  ctx.fillText(sec.label, 26, hy + hh2 / 2 - 9, SW - 160);
  ctx.font = '600 11.5px ui-rounded, "SF Pro Rounded", Comfortaa, sans-serif';
  ctx.fillStyle = '#D9C49A';
  ctx.fillText(sec.mkts.length + ' rows growing', 26, hy + hh2 / 2 + 10);
  ctx.textAlign = 'right';
  ctx.font = '800 14px ui-monospace, Menlo, monospace';
  ctx.fillStyle = '#F6E3C1';
  ctx.fillText('$' + sec.tot.toFixed(2) + ' today', SW - 26, hy + hh2 / 2);
  ctx.textAlign = 'left';
}
function drawTool(){
  if(!ACT || !ACT.close) return;
  const cell = BEDV && BEDV.cells.find(cl => cl.c === ACT.c);
  const tx = cell ? cell.x : CX;
  const ty = cell ? cell.y - (BEDV ? BEDV.scroll : 0) : SH * .4;
  const u = ACT.t / ACT.dur;
  const rise = Math.sin(Math.min(1, u * 4) * Math.PI / 2);
  const fall = u > .85 && !ACT.hold ? (u - .85) / .15 : 0;
  const lift = rise * (1 - fall);
  if(ACT.kind === 'water'){
    const k = SW * .24;
    const kx = tx + SW * .26 + (1 - lift) * SW * .5;
    const ky = ty - SH * .04 + (1 - lift) * SH * .1;
    const tilt = -.5 * Math.sin(Math.min(1, u * 2.2) * Math.PI);
    ctx.save(); ctx.translate(kx, ky); ctx.rotate(tilt);
    drawPix(ctx, pixSprite('can', 36, (gg, kk) => drawCanV(gg, kk)), 0, k * .5, k * 1.15);
    ctx.restore();
  }else{
    const grab = (ACT.kind === 'weedall' || ACT.kind === 'trim') && u > .3 && u < .75;
    const open = !grab && ACT.kind !== 'plant';
    const k = SW * .26;
    const wob = ACT.kind === 'weedall' ? Math.sin(u * 12) * SW * .1 : 0;
    ctx.save();
    ctx.translate(tx + wob, ty + SH * .3 + k * .1 - lift * SH * .3);
    drawPix(ctx, pixSprite('hand' + (open ? 1 : 0), 32,
      (gg, kk) => drawHandV(gg, kk, open)), 0, 0, k);
    ctx.restore();
  }
}
function drawParts(){
  PARTS.forEach(p => {
    if(p.kind === 'drop'){
      const u = Math.min(1, p.u), mx = (p.sx + p.tx) / 2, my = Math.min(p.sy, p.ty) - SH * .1;
      const x = (1 - u) * (1 - u) * p.sx + 2 * (1 - u) * u * mx + u * u * p.tx;
      const y = (1 - u) * (1 - u) * p.sy + 2 * (1 - u) * u * my + u * u * p.ty;
      ctx.fillStyle = 'rgba(90,170,230,.9)';
      ctx.beginPath(); ctx.ellipse(x, y, 2.4, 4, .2, 0, 7); ctx.fill();
    }else if(p.kind === 'weedfly'){
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, p.life * 2);
      drawWeedsV(ctx, 22, 55); ctx.restore(); ctx.globalAlpha = 1;
    }else if(p.kind === 'crumb'){
      ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = '#5E3D24';
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    }else if(p.kind === 'seed'){
      ctx.fillStyle = '#8A6236';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 2.6, 1.8, .5, 0, 7); ctx.fill();
    }
  });
}
function draw(){
  const zoomEase = ZOOM * ZOOM * (3 - 2 * ZOOM);
  Feff = F * (1 + zoomEase * 1.6);
  if((MODE === 'bed' || MODE === 'flyout') && BEDFADE > 0){
    drawBed();
    if(BEDFADE < 1){
      ctx.fillStyle = 'rgba(16,12,8,' + ((1 - BEDFADE) * .9).toFixed(2) + ')';
      ctx.fillRect(0, 0, SW, SH);
    }
  }else drawPan();
  drawParts();
  drawTool();
  const L = daylight(), t = tday();
  if(L < 1){ ctx.fillStyle = 'rgba(24,32,72,' + ((1 - L) * .42).toFixed(3) + ')'; ctx.fillRect(0, 0, SW, SH); }
  if((t > .58 && t < .7) || (t > .02 && t < .12)){
    ctx.fillStyle = 'rgba(255,140,60,.1)'; ctx.fillRect(0, 0, SW, SH);
  }
  const vg = ctx.createRadialGradient(CX, SH * .48, SH * .4, CX, SH * .48, SH * .95);
  vg.addColorStop(0, 'rgba(24,16,8,0)'); vg.addColorStop(1, 'rgba(24,16,8,.3)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, SW, SH);
  if(MODE === 'fly' || (MODE === 'flyout' && BEDFADE <= 0)){
    const a = Math.max(0, ZOOM - .55) / .45;
    if(a > 0){ ctx.fillStyle = 'rgba(16,12,8,' + (a * .92).toFixed(2) + ')'; ctx.fillRect(0, 0, SW, SH); }
  }
  if(fadeIn < 1){ ctx.fillStyle = 'rgba(14,18,26,' + (1 - fadeIn) + ')'; ctx.fillRect(0, 0, SW, SH); }
}
const CLOUDS = [];
for(let i = 0; i < 6; i++) CLOUDS.push({a:Math.random() * Math.PI * 2,
  dy:60 + Math.random() * 130, w:26 + Math.random() * 30});
setInterval(() => CLOUDS.forEach(c => c.a += .0006), 50);

// ---------------- data refresh ----------------
let refreshing = false;
async function refresh(first){
  if(refreshing) return;
  refreshing = true;
  try{
    const [d, pos] = await Promise.all([jget('/data.json'), jget('/positions.json').catch(() => null)]);
    buildWorld(d, pos);
    if(first) toast('the garden is live — ' + CROPS.length + ' rows growing');
  }catch(e){
    if(String(e.message) !== 'auth') toast('garden refresh failed: ' + e.message);
  }
  refreshing = false;
}
setInterval(() => { if(!BUSY) refresh(); }, 60000);
refresh(true);

// ---------------- boot ----------------
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SW = innerWidth; SH = innerHeight;
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = SW / 2; F = SH * .5; HOR0 = SH * .40;
  if(BEDV) layoutBed();
}
window.addEventListener('resize', resize);
resize();
function frame(t){
  const dt = Math.min(.05, (t - lastT) / 1000 || .016); lastT = t; T = t;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.DEBUG = {P, get CROPS(){ return CROPS; }, get SECTIONS(){ return SECTIONS; },
  get BEDV(){ return BEDV; }, openBed, openPlant, closeBed, closePlant, refresh,
  setWorld(d, pos){ buildWorld(d, pos); }};
</script>
